<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>订单审核后台</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f7fafc;padding:20px}
h1{margin-bottom:12px}
.order{background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:16px;margin-bottom:12px;display:grid;grid-template-columns:160px 1fr;gap:14px}
.order img{max-width:100%;border-radius:8px;border:1px solid #e2e8f0}
.btn{display:inline-flex;align-items:center;justify-content:center;background:#2b6cb0;color:#fff;font-size:14px;border:none;border-radius:8px;padding:8px 12px;margin-right:8px;cursor:pointer}
.btn.red{background:#c53030}
.badge{font-size:12px;padding:2px 6px;border-radius:5px;margin-left:8px}
.badge.pending{background:#fff3cd;border:1px solid #ffeeba;color:#856404}
.badge.approved{background:#e6fffa;border:1px solid #38b2ac;color:#0f766e}
.badge.rejected{background:#ffe6e6;border:1px solid #fc8181;color:#822727}
.small{font-size:13px;color:#4a5568;margin-top:4px}
</style>
</head>
<body>

<h1>人工订单审核后台 <span id="me"></span></h1>
<div id="list"></div>

<script type="module">
import supabaseClient from './client.js';
import { protectPage } from './auth.js';

await protectPage(['admin']);

document.getElementById('me').textContent = '(仅管理员可见)';

const list = document.getElementById('list');

function parsePlanMemo(m){
  if(!m) return '';
  const m2 = m.toLowerCase();
  if(m2.includes('year')) return '年 ¥299';
  if(m2.includes('quarter')) return '季 ¥79';
  if(m2.includes('month')) return '月 ¥29';
  return '(未识别)';
}

async function refresh(){
  list.innerHTML = '加载中...';
  const { data, error } = await supabaseClient.from('orders').select('*').order('created_at',{ascending:false});
  if(error) return list.innerHTML='加载失败:'+error.message;

  list.innerHTML='';
  for(const o of data){
    const plan = parsePlanMemo(o.memo);
    list.innerHTML += `
    <div class="order">
      <div><img src="${o.image_url}" /></div>
      <div>
        <b>${o.email||'(无邮箱)'}</b>
        <span class="badge ${o.status}">${o.status}</span><br/>
        <div class="small">套餐：${plan}</div>
        <div class="small">备注：${o.memo||''}</div>
        <div class="small">提交时间：${new Date(o.created_at).toLocaleString()}</div>
        <br>
        <button class="btn" onclick="approve('${o.user_id}')">通过并升级</button>
        <button class="btn red" onclick="reject('${o.id}')">拒绝</button>
      </div>
    </div>`;
  }
}

window.approve = async(user_id)=>{
  // 把 user role 设置为 paid_user
  const { error:e1 } = await supabaseClient.from('profiles').update({role:'paid_user'}).eq('id',user_id);
  if(e1) return alert('更新用户失败:'+e1.message);

  // 把所有订单都标记 approved
  await supabaseClient.from('orders').update({status:'approved'}).eq('user_id',user_id);

  alert('已开通此用户付费会员');
  refresh();
};

window.reject = async(id)=>{
  await supabaseClient.from('orders').update({status:'rejected'}).eq('id',id);
  refresh();
};

refresh();
</script>
</body>
</html>
