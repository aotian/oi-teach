<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>订单审核后台 - 童澄 CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: '#FA7800', hover: '#c2410c' } } } } }
    </script>
    <style>body{background:#f8fafc}</style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 px-6 h-16 flex justify-between items-center shadow-sm shrink-0 z-50">
        <div class="flex items-center gap-8">
            <div class="font-bold text-gray-800 text-lg flex items-center gap-2">
                <img src="assets/logo.png" class="w-7 h-7 rounded object-cover">
                童澄后台
            </div>
            
            <nav class="flex bg-gray-100 p-1 rounded-lg">
                <a href="admin-content.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                    📚 内容管理
                </a>
                <a href="admin-problems.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                    ✍️ 题库录入
                </a>
                <a href="admin-orders.html" class="px-4 py-1.5 rounded-md text-sm font-bold bg-white text-orange-600 shadow-sm transition">
                    💰 订单审核
                </a>
            </nav>
        </div>

        <div class="flex items-center gap-4 text-sm">
            <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded font-bold">管理员模式</span>
            <a href="index.html" class="text-gray-400 hover:text-gray-600 transition">退出后台</a>
        </div>
    </header>

    <main class="flex-1 max-w-5xl w-full mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-xl font-bold text-gray-800">待处理订单</h2>
            <div class="flex gap-4 items-center text-sm">
                <span id="stat-info" class="text-gray-500 bg-white px-3 py-1 rounded border border-gray-200">加载统计...</span>
                <button onclick="location.reload()" class="text-brand hover:underline">刷新列表</button>
            </div>
        </div>

        <div id="order-list" class="space-y-4">
            <div class="text-center text-gray-400 mt-20">正在加载订单...</div>
        </div>
    </main>

    <script type="module">
        import supabase from './client.js';

        (async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return location.href = 'login.html';
            
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
            if (profile?.role !== 'admin') {
                alert('权限不足');
                return location.href = 'index.html';
            }

            loadStats();
            loadOrders();
        })();

        async function loadStats() {
            const { data } = await supabase.from('orders_stats_daily').select('*').limit(1);
            const t = data?.[0];
            if (t) {
                document.getElementById('stat-info').innerHTML = 
                    `今日: <b>${t.total}</b> 单 (待审 <span class="text-brand font-bold">${t.pending}</span>)`;
            }
        }

        async function loadOrders() {
            const { data: orders, error } = await supabase
                .from('orders')
                .select('*')
                .order('created_at', { ascending: false })
                .limit(50);

            if (error) return alert('加载失败');

            const container = document.getElementById('order-list');
            container.innerHTML = '';

            const hashMap = {};
            orders.forEach(o => {
                if (o.image_hash) hashMap[o.image_hash] = (hashMap[o.image_hash] || 0) + 1;
            });

            orders.forEach(o => {
                const isDup = o.image_hash && hashMap[o.image_hash] > 1;
                const date = new Date(o.created_at).toLocaleString();
                
                let statusBadge = '';
                if (o.status === 'pending') statusBadge = '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded text-xs font-bold">待审核</span>';
                else if (o.status === 'approved') statusBadge = '<span class="bg-green-100 text-green-700 px-2 py-1 rounded text-xs font-bold">已通过</span>';
                else statusBadge = '<span class="bg-red-100 text-red-700 px-2 py-1 rounded text-xs font-bold">已拒绝</span>';

                const el = document.createElement('div');
                el.className = "bg-white rounded-xl shadow-sm border border-gray-200 p-6 flex flex-col md:flex-row gap-6 transition hover:shadow-md";
                
                el.innerHTML = `
                    <div class="w-full md:w-48 shrink-0 bg-gray-50 rounded-lg border border-gray-100 flex items-center justify-center overflow-hidden">
                        <a href="${o.image_url}" target="_blank">
                            <img src="${o.image_url}" class="max-h-40 object-contain hover:scale-110 transition duration-300">
                        </a>
                    </div>
                    <div class="flex-1">
                        <div class="flex justify-between items-start mb-2">
                            <div>
                                <div class="text-sm text-gray-500 mb-1">订单号 #${o.id} · ${date}</div>
                                <div class="font-bold text-gray-800 text-lg">${o.email}</div>
                            </div>
                            <div class="flex flex-col items-end gap-1">
                                ${statusBadge}
                                ${isDup ? '<span class="bg-red-50 text-red-500 px-2 py-0.5 rounded text-[10px] border border-red-100">⚠️ 重复图片</span>' : ''}
                            </div>
                        </div>
                        <div class="bg-orange-50 text-orange-800 px-3 py-2 rounded text-sm mb-4 border border-orange-100">
                            📝 备注：${o.memo || '无'}
                        </div>
                        ${o.status === 'pending' ? `
                            <div class="border-t border-gray-100 pt-4 flex items-center gap-3 flex-wrap">
                                <span class="text-sm font-bold text-gray-600">开通时长:</span>
                                <label class="flex items-center gap-1 cursor-pointer text-sm"><input type="radio" name="dur-${o.id}" value="30" checked> 30天</label>
                                <label class="flex items-center gap-1 cursor-pointer text-sm"><input type="radio" name="dur-${o.id}" value="90"> 90天</label>
                                <label class="flex items-center gap-1 cursor-pointer text-sm"><input type="radio" name="dur-${o.id}" value="365"> 1年</label>
                                <div class="flex-1 text-right space-x-2">
                                    <button onclick="window.handleReject(${o.id})" class="px-3 py-1.5 text-sm text-gray-500 hover:bg-gray-100 rounded border border-gray-200 transition">拒绝</button>
                                    <button onclick="window.handleApprove(${o.id}, '${o.user_id}')" class="px-4 py-1.5 text-sm bg-brand text-white font-bold rounded hover:bg-brand-hover shadow-sm transition">通过并开通</button>
                                </div>
                            </div>
                        ` : ''}
                        ${o.status === 'approved' ? `
                            <div class="mt-2 text-right">
                                <button onclick="window.handleRevoke(${o.id}, '${o.user_id}')" class="text-xs text-red-400 hover:underline">撤销会员资格</button>
                            </div>
                        ` : ''}
                    </div>
                `;
                container.appendChild(el);
            });
        }

        window.handleApprove = async (orderId, userId) => {
            if(!confirm('确认通过此订单并开通会员？')) return;

            const days = document.querySelector(`input[name="dur-${orderId}"]:checked`).value;
            const newExpiry = new Date();
            newExpiry.setDate(newExpiry.getDate() + parseInt(days));

            // 1. 先查一下目标用户现在的角色
            const { data: targetProfile, error: profileErr } = await supabase
                .from('profiles')
                .select('role')
                .eq('id', userId)
                .single();

            if (profileErr) {
                alert('读取用户角色失败：' + profileErr.message);
                return;
            }

            // 2. 决定 new_role：
            //    - admin 还是 admin（拥有所有 VIP 权限）
            //    - teacher 还是 teacher（以后老师账号也保留）
            //    - 其它用户才升级为 paid_user
            let newRole = 'paid_user';
            const currentRole = targetProfile?.role?.trim();
            if (currentRole === 'admin' || currentRole === 'teacher') {
                newRole = currentRole;
            }

            // 3. 调用 RPC，只更新有效期 +（必要时）角色
            const { error: rpcErr } = await supabase.rpc('admin_set_expiry', {
                target_user_id: userId,
                new_expiry_date: newExpiry.toISOString(),
                new_role: newRole
            });

            if (rpcErr) {
                alert('权限设置失败: ' + rpcErr.message);
                return;
            }

    // 4. 更新订单状态
    await supabase.from('orders').update({ status: 'approved' }).eq('id', orderId);
    loadOrders();
    loadStats();
};

    </script>
</body>
</html>
