<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>知识点 · BFS（示例）</title>
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body{ background:#fff7ed }
    .container{ max-width:900px; margin:0 auto; padding:16px }
    .title{ font-weight:800; font-size:22px; color:#7c2d12; margin:10px 0 12px }
    .card{ background:#fff;border:1px solid #ffe4cc;border-radius:14px;padding:14px }
    .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px dashed #ffe4cc}
    .row:last-child{border-bottom:0}
    .btn{ background:#f97316;color:#fff;border:0;border-radius:10px;padding:8px 12px;cursor:pointer }
    .badge{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;margin-left:8px}
    .badge-free{ background:#dcfce7; color:#166534 }    /* 首节免费（仅未付费显示） */
    .badge-locked{ background:#fee2e2; color:#991b1b }  /* 付费 */
    .badge-unlocked{ background:#86efac; color:#065f46 }/* 已解锁（付费用户显示绿色） */
  </style>
</head>
<body>
  <div class="container">
    <div class="flex items-center justify-between">
      <a class="text-orange-700 hover:underline" href="../index.html">← 返回首页</a>
      <div id="auth-actions"></div>
    </div>

    <div class="title">核心算法 · BFS（示例）</div>
    <div class="card">
      <div id="list"></div>
    </div>
  </div>

  <script type="module">
    import supabase from '../client.js';

    // 获取角色
    async function getRole(){
      const { data:auth } = await supabase.auth.getUser();
      if(!auth?.user) return 'free_user';
      const { data:p } = await supabase.from('profiles').select('role').single();
      return p?.role || 'free_user';
    }

    // ① 本地列表（先有就能用）
    const localProblems = [
      { slug:'bfs-intro',  title:'BFS 入门模板', free:true  },
      { slug:'bfs-short',  title:'最短路（无权图）', free:false },
      { slug:'bfs-grid',   title:'网格最短步数（迷宫）', free:false }
    ];

    // ② 从 DB 拉（有表后替换 topicId）
    async function fetchFromDB(){
      const topicId = 1001; // TODO: 改成你的实际 topic_id
      const { data, error } = await supabase
        .from('topic_problems')
        .select('order_no, problems:problem_id (slug,title,is_free)')
        .eq('topic_id', topicId)
        .order('order_no', { ascending: true });
      if(error||!data) return null;
      return data.map(x=>({ slug:x.problems.slug, title:x.problems.title, free:!!x.problems.is_free }));
    }

    function render(list, role){
      const el=document.getElementById('list'); el.innerHTML='';
      const isPaid = ['paid_user','admin','teacher'].includes(role);

      list.forEach((p, idx)=>{
        const row = document.createElement('div'); row.className='row';
        const left = document.createElement('div');
        left.innerHTML = `<span class="font-medium">${p.title}</span>`;

        const badge = document.createElement('span'); badge.className='badge';
        if(isPaid){
          badge.classList.add('badge-unlocked'); badge.textContent='已解锁';
        }else{
          if(idx===0 || p.free){ badge.classList.add('badge-free'); badge.textContent='首节免费'; }
          else { badge.classList.add('badge-locked'); badge.textContent='付费'; }
        }
        left.appendChild(badge);

        const right = document.createElement('div');
        const btn = document.createElement('button'); btn.className='btn'; btn.textContent='进入';
        btn.onclick = ()=>{
          if(isPaid || idx===0 || p.free) location.href = `./${p.slug}.html`;
          else { alert('此小节为付费内容，请升级后继续学习。'); location.href='../upgrade.html'; }
        };
        right.appendChild(btn);

        row.appendChild(left); row.appendChild(right);
        el.appendChild(row);
      });
    }

    (async ()=>{
      const role = await getRole().catch(()=> 'free_user');
      let list = await fetchFromDB();
      if(!list || list.length===0) list = localProblems;
      render(list, role);
    })();
  </script>
</body>
</html>
