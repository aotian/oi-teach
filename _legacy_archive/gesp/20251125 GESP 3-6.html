#include <string>
using namespace std;

int main() {
    string s;
    getline(cin, s); // 读取带空格的一整行

    int maxLen = 0, currentLen = 0;
    int maxEndIndex = 0; // 记录最长单词结束的位置

    // 技巧：给字符串最后加个空格，统一处理逻辑

        if (s[i] != ' ' && s[i] != '.') {
            // 如果是字母，长度+1
            currentLen++;
        } else {
            // 如果是分隔符，结算当前单词
            if (currentLen > maxLen) {
                maxLen = currentLen;
                maxEndIndex = i; // 记录结束位置
            }
            currentLen = 0; // 归零，准备下一个单词
        }
    }

    // 输出最长单词
    // substr(起始位置, 长度)
    // 起始位置 = 结束位置 - 长度
    cout << s.substr(maxEndIndex - maxLen, maxLen) << endl;
    return 0;
}`

#include <vector>
using namespace std;

int main() {
    string s1, s2;
    cin >> s1 >> s2;
    
    // 结果最长是两位数长度之和
    vector<int> a, b, c(s1.length() + s2.length(), 0);

    // 倒序处理
    for (int i = s1.length() - 1; i >= 0; i--) a.push_back(s1[i] - '0');
    for (int i = s2.length() - 1; i >= 0; i--) b.push_back(s2[i] - '0');

    // 核心乘法逻辑
    for (int i = 0; i < a.size(); i++) {
        for (int j = 0; j < b.size(); j++) {
            c[i + j] += a[i] * b[j]; // 累加乘积
        }
    }

    // 处理进位
    for (int i = 0; i < c.size() - 1; i++) {
        c[i + 1] += c[i] / 10;
        c[i] %= 10;
    }

    // 去除前导零（从高位往低位看）
    int len = c.size() - 1;
    while (len > 0 && c[len] == 0) len--;

    // 倒序输出
    for (int i = len; i >= 0; i--) cout << c[i];

}`

using namespace std;

int ans[9]; // ans[i] 表示第i行的皇后放在第几列
int b, cnt = 0; // b是要求的第几个解，cnt是当前计数
bool col[9], d1[20], d2[20]; // 列、主对角线、副对角线标记

void dfs(int row) {
    if (row > 8) { // 8行都放完了，找到一个解
        cnt++;
        if (cnt == b) {
            for (int i = 1; i <= 8; i++) cout << ans[i];
            cout << endl;
        }
        return;
    }

    for (int c = 1; c <= 8; c++) {
        // 检查列、主对角线(row-c)、副对角线(row+c)是否有冲突
        // +8 是为了防止 row-c 出现负数索引
        if (!col[c] && !d1[row - c + 8] && !d2[row + c]) {
            // 标记占用
            col[c] = true; 
            d1[row - c + 8] = true; 
            d2[row + c] = true;
            ans[row] = c; // 记录位置
            
            dfs(row + 1); // 递归下一行
            
            // 回溯：撤销标记，准备尝试下一列
            col[c] = false; 
            d1[row - c + 8] = false; 
            d2[row + c] = false;
        }
    }

                    code: `#include <iostream>
#include <algorithm>
using namespace std;

int a[1005][1005]; // 存原始数据
int f[1005][1005]; // 存DP结果（即从该点到底部的最大和）

int main() {
    int n;
    cin >> n;
    // 输入金字塔
    for (int i = 1; i <= n; i++) {
        for (int j = 1; j <= i; j++) {
            cin >> a[i][j];
        }
    }

    // 初始化最后一行：到底部的最大和就是它自己
    for (int j = 1; j <= n; j++) {
        f[n][j] = a[n][j];
    }

    // 从倒数第二行开始，往上递推
    for (int i = n - 1; i >= 1; i--) {
        for (int j = 1; j <= i; j++) {
            // 核心公式：选左下和右下中较大的那个累加
            f[i][j] = a[i][j] + max(f[i + 1][j], f[i + 1][j + 1]);
        }
    }

    // 塔顶就是答案
    cout << f[1][1] << endl;
    return 0;
}`

                    if (
                        e.key === 'F12' || 
                        (e.ctrlKey && e.shiftKey && e.key === 'I') || 
                        (e.ctrlKey && e.shiftKey && e.key === 'C') || 
                        (e.ctrlKey && e.shiftKey && e.key === 'J') || 
                        (e.ctrlKey && e.key === 'u')
                    ) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }
                };

                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('keydown', handleKeyDown);

                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('keydown', handleKeyDown);
                };
            }, []);

            return (
                <div className="min-h-screen bg-gray-50 text-gray-800 font-sans flex flex-col md:flex-row select-none">
                    
                    {/* Sidebar Navigation */}
                    <div className="w-full md:w-64 bg-white border-r border-gray-200 p-4 flex-shrink-0 flex flex-col gap-4 overflow-y-auto h-auto md:h-screen sticky top-0">
                        <div className="mb-4">
                            <h1 className="text-xl font-extrabold text-orange-600 flex items-center gap-2">
                                <Layers className="text-orange-500" />
                                GESP 题库精讲
                            </h1>
                            <p className="text-xs text-gray-400 mt-1">一本通OJ 高频难点配套 - 童澄专版</p>
                        </div>

                        <div className="space-y-2">
                            {[3, 4, 5, 6].map(level => (
                                <LevelBadge 
                                    key={level} 
                                    level={level} 
                                    active={activeLevel === level}
                                    onClick={() => {
                                        setActiveLevel(level);
                                        setActiveProblemId(problemsData[level][0].id);
                                        setActiveTab('logic');
                                    }}
                                />
                            ))}
                        </div>

                        <div className="mt-6">
                            <h3 className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3 px-1">本级题目列表</h3>
                            <div className="space-y-3">
                                {currentLevelProblems.map(problem => (
                                    <ProblemCard 
                                        key={problem.id}
                                        problem={problem}
                                        active={activeProblem.id === problem.id}
                                        onClick={() => setActiveProblemId(problem.id)}
                                    />
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* Main Content */}
                    <div className="flex-1 p-4 md:p-8 overflow-y-auto">
                        <div className="max-w-4xl mx-auto">
                            
                            {/* Header */}
                            <header className="mb-8">
                                <div className="flex items-center gap-2 text-sm text-orange-600 font-medium mb-2">
                                    <span>GESP {activeLevel}级</span>
                                    <ChevronRight size={14} />
                                    <span>一本通OJ #{activeProblem.id}</span>
                                </div>
                                <h2 className="text-3xl font-bold text-gray-900 mb-4">{activeProblem.title}</h2>
                                <p className="text-gray-600 bg-white p-4 rounded-xl border border-gray-200 shadow-sm leading-relaxed">
                                    {activeProblem.desc}
                                </p>
                            </header>

                            {/* Interaction Tabs */}
                            <div className="flex items-center gap-2 mb-6 border-b border-gray-200">
                                <button 
                                    onClick={() => setActiveTab('logic')}
                                    className={`px-4 py-2 text-sm font-medium flex items-center gap-2 transition-colors border-b-2 ${
                                        activeTab === 'logic' 
                                        ? 'border-orange-500 text-orange-600' 
                                        : 'border-transparent text-gray-500 hover:text-gray-700'
                                    }`}
                                >
                                    <Lightbulb size={16} />
                                    解题思路图解
                                </button>
                                <button 
                                    onClick={() => setActiveTab('code')}
                                    className={`px-4 py-2 text-sm font-medium flex items-center gap-2 transition-colors border-b-2 ${
                                        activeTab === 'code' 
                                        ? 'border-orange-500 text-orange-600' 
                                        : 'border-transparent text-gray-500 hover:text-gray-700'
                                    }`}
                                >
                                    <Code size={16} />
                                    参考代码 (C++)
                                </button>
                            </div>

                            {/* Tab Content */}
                            <div className="min-h-[400px]">
                                {activeTab === 'logic' && (
                                    <div className="grid grid-cols-1 gap-4">
                                        {activeProblem.logic.map((step, idx) => (
                                            <div key={idx} className="bg-white p-5 rounded-xl border border-gray-100 shadow-sm hover:shadow-md transition-shadow flex gap-4">
                                                <div className="flex-shrink-0 w-8 h-8 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-bold">
                                                    {idx + 1}
                                                </div>
                                                <div>
                                                    <h4 className="font-bold text-gray-800 mb-1">{step.title}</h4>
                                                    <p className="text-gray-600 text-sm leading-relaxed">{step.text}</p>
                                                </div>
                                            </div>
                                        ))}
                                        
                                        <div className="mt-4 p-6 bg-orange-50 rounded-xl border border-orange-100 flex flex-col items-center justify-center text-center">
                                            <div className="text-orange-900 font-semibold mb-2 flex items-center gap-2">
                                                <Cpu size={18} />
                                                核心思维模型
                                            </div>
                                            <div className="text-orange-600 text-sm max-w-lg">
                                                {activeLevel === 3 ? "提示：重点在于边界条件的处理（如最后一个字符）。" :
                                                activeLevel === 4 ? "提示：画图是解决矩阵和排序问题的最好方法。" :
                                                activeLevel === 5 ? "提示：数论题不要暴力枚举，利用数学性质（如sqrt）优化。" :
                                                "提示：搜索问题要像走迷宫一样思考，遇到死胡同记得'回溯'。"}
                                            </div>
                                        </div>
                                    </div>
                                )}

                                {activeTab === 'code' && (
                                    <div className="relative">
                                        <div className="absolute top-0 right-0 p-2">
                                            <span className="text-xs text-gray-400 bg-gray-800 px-2 py-1 rounded">C++</span>
                                        </div>
                                        <pre className="bg-gray-900 text-gray-100 p-6 rounded-xl overflow-x-auto text-sm font-mono leading-relaxed shadow-inner">
                                            <code>{activeProblem.code}</code>
                                        </pre>
                                        <div className="mt-4 flex items-start gap-2 text-sm text-gray-500">
                                            <CheckCircle size={16} className="text-green-500 mt-0.5" />
                                            <span>此代码已针对一本通OJ进行优化，包含必要的头文件和命名空间。注释部分解释了关键逻辑。</span>
                                        </div>
                                    </div>
                                )}
                            </div>

                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<div class="p-4 border-t border-orange-100 text-xs text-center text-orange-400 bg-orange-50/50">
            &copy; 2025 上海童澄培训学校有限公司<br>版权所有
        </div>
</body>
</html>
