    如果是数字:
        sum += 数字 * count
        count++
4. 计算正确校验码:
    mod = sum % 11
    code = (mod==10) ? 'X' : mod
5. 比较 s 的最后一位和 code:
    相等 -> 输出 Right

        // --- 子组件: 可视化部分 (Uppercase, Split, Hex, Find, ReverseSwap, Isbn) 保持不变 ---

        const UppercaseVisualizer = () => {
            const initStr = "Hello";
            const [chars, setChars] = useState(initStr.split(""));
            const [idx, setIdx] = useState(0);
            const handleNext = () => {
                if (idx >= chars.length) return;
                const newChars = [...chars];
                if (newChars[idx] >= 'a' && newChars[idx] <= 'z') newChars[idx] = newChars[idx].toUpperCase();
                setChars(newChars); setIdx(prev => prev + 1);
            };
            const handleReset = () => { setChars(initStr.split("")); setIdx(0); };
            return (
                <div className="bg-white p-6 rounded-xl border border-orange-200 shadow-sm">
                    <h4 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Cpu size={18}/> 算法演示板</h4>

                    </div>
                    <Controls reset={handleReset} next={handleNext} info={`当前字符: ${idx < chars.length ? chars[idx] : 'End'}`} />
                </div>
            );
        };
        const SplitVisualizer = () => {
            const text = "Hi, C++"; const [idx, setIdx] = useState(0); const [word, setWord] = useState(""); const [words, setWords] = useState([]);
            const handleNext = () => {
                if (idx > text.length) return;
                if (idx === text.length) { setIdx(idx + 1); return; }
                const char = text[idx];
                if (char !== ' ' && char !== ',') { setWord(prev => prev + char); } 
                else { if (word) { setWords(prev => [...prev, word]); setWord(""); } }
                setIdx(prev => prev + 1);
            };
            const handleReset = () => { setIdx(0); setWord(""); setWords([]); };
            return (
                <div className="bg-white p-6 rounded-xl border border-orange-200 shadow-sm">
                    <h4 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Cpu size={18}/> 算法演示板</h4>
                    <div className="flex items-center gap-1 mb-6 font-mono text-lg bg-gray-100 p-3 rounded">
                        {text.split('').map((c, i) => <span key={i} className={`px-1 rounded ${i === idx ? 'bg-orange-500 text-white' : ''}`}>{c}</span>)}

                    <div className="grid grid-cols-2 gap-4"><div className="bg-blue-50 p-3 rounded border border-blue-100"><div className="text-xs text-blue-500 mb-1">当前缓冲区</div><div className="font-bold text-blue-700 min-h-[24px]">{word}</div></div><div className="bg-green-50 p-3 rounded border border-green-100"><div className="text-xs text-green-500 mb-1">已提取</div><div className="flex gap-2 flex-wrap">{words.map((w, i) => <span key={i} className="bg-white px-2 rounded border border-green-200 text-sm">{w}</span>)}</div></div></div>

                </div>
            );

        const HexVisualizer = () => {
            const hex = "1A"; const [idx, setIdx] = useState(0); const [ans, setAns] = useState(0);
            const handleNext = () => {
                if (idx >= hex.length) return;
                const char = hex[idx];
                let val = (char >= '0' && char <= '9') ? parseInt(char) : char.charCodeAt(0) - 'A'.charCodeAt(0) + 10;
                setAns(prev => prev * 16 + val); setIdx(prev => prev + 1);
            };
            const handleReset = () => { setIdx(0); setAns(0); };
            return (
                <div className="bg-white p-6 rounded-xl border border-orange-200 shadow-sm">
                    <h4 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Cpu size={18}/> 秦九韶算法演示</h4>
                    <div className="flex items-center justify-center gap-4 mb-6">{hex.split('').map((c, i) => <div key={i} className={`w-10 h-10 flex items-center justify-center font-bold rounded ${i === idx ? 'bg-orange-500 text-white shadow-lg scale-110' : 'bg-gray-100 text-gray-400'}`}>{c}</div>)}</div>
                    <div className="bg-gray-800 text-green-400 font-mono p-4 rounded-lg text-center mb-2">ans = {ans};</div>
                    <Controls reset={handleReset} next={handleNext} info={`Processing...`} />
                </div>
            );
        };
        const FindVisualizer = () => {
            const s1 = "abc"; const s2 = "xabcy"; const [i, setI] = useState(0); const [found, setFound] = useState(false);
            const handleNext = () => {
                if (found || i > s2.length - s1.length) return;
                if (s2.substr(i, s1.length) === s1) setFound(true); else setI(prev => prev + 1);
            };
            const handleReset = () => { setI(0); setFound(false); };
            return (
                <div className="bg-white p-6 rounded-xl border border-orange-200 shadow-sm">
                    <h4 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Search size={18}/> 滑动窗口演示</h4>
                    <div className="mb-6 relative h-20 flex items-center justify-center">
                        <div className="flex gap-1 absolute top-0">{s2.split('').map((c, idx) => <div key={idx} className={`w-10 h-10 border flex items-center justify-center font-bold rounded bg-gray-50 ${found && idx >= i && idx < i + s1.length ? 'bg-green-100 border-green-500 text-green-700' : ''}`}>{c}</div>)}</div>
                        <div className="flex gap-1 absolute top-12 transition-all duration-300" style={{ left: '50%', marginLeft: `${(i - 2.5) * 44}px` }}>{s1.split('').map((c, idx) => <div key={idx} className="w-10 h-10 border-2 border-orange-500 text-orange-600 flex items-center justify-center font-bold rounded bg-white shadow-lg">{c}</div>)}</div>
                    </div>
                    <Controls reset={handleReset} next={handleNext} info={found ? "Found!" : "Searching..."} />
                </div>
            );
        };
        const ReverseSwapVisualizer = () => {
            const [s, setS] = useState("AbCd"); const [step, setStep] = useState(0);
            const handleNext = () => {
                if (step === 0) { setS(prev => prev.split('').reverse().join('')); setStep(1); }
                else if (step <= s.length) {
                    const idx = step - 1;
                    setS(prev => { const arr = prev.split(''); const c = arr[idx]; if (c >= 'a' && c <= 'z') arr[idx] = c.toUpperCase(); else if (c >= 'A' && c <= 'Z') arr[idx] = c.toLowerCase(); return arr.join(''); });
                    setStep(prev => prev + 1);
                }
            };
            const handleReset = () => { setS("AbCd"); setStep(0); };
            return (
                <div className="bg-white p-6 rounded-xl border border-orange-200 shadow-sm">
                    <h4 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Cpu size={18}/> 解密流程演示</h4>
                    <div className="flex justify-center gap-3 mb-6">{s.split('').map((c, i) => <div key={i} className={`w-12 h-14 flex items-center justify-center text-2xl font-bold rounded border-2 transition-all ${step === 0 ? 'bg-gray-50 border-gray-200' : ''} ${step === 1 ? 'bg-blue-50 border-blue-400 rotate-y-180' : ''} ${step > 1 && i === step - 2 ? 'bg-orange-100 border-orange-500 scale-110' : ''}`}>{c}</div>)}</div>
                    <Controls reset={handleReset} next={handleNext} info={step===0?"点击开始":step===1?"已翻转":"正在互换"} />
                </div>
            );
        };
        const IsbnVisualizer = () => {
            const isbn = "0-670-82162-4"; const [idx, setIdx] = useState(0); const [count, setCount] = useState(1); const [sum, setSum] = useState(0); const [finished, setFinished] = useState(false);
            const handleNext = () => {
                if (finished || idx >= isbn.length - 1) { if (!finished) setFinished(true); return; }
                const char = isbn[idx];
                if (char >= '0' && char <= '9') { setSum(prev => prev + (parseInt(char) * count)); setCount(prev => prev + 1); }
                setIdx(prev => prev + 1);
            };
            const handleReset = () => { setIdx(0); setCount(1); setSum(0); setFinished(false); };
            return (
                <div className="bg-white p-6 rounded-xl border border-orange-200 shadow-sm">
                    <h4 className="font-bold text-gray-700 mb-4 flex items-center gap-2"><Cpu size={18}/> 校验和计算演示</h4>
                    <div className="flex justify-center gap-1 mb-6 font-mono text-lg">{isbn.split('').map((c, i) => <div key={i} className={`w-8 h-10 flex items-center justify-center rounded border ${i === idx && !finished ? 'bg-blue-500 text-white border-blue-600 scale-110 shadow' : 'bg-gray-50 border-gray-200'} ${i === isbn.length - 1 ? 'border-dashed border-gray-400 text-gray-400' : ''}`}>{c}</div>)}</div>
                    <div className="grid grid-cols-2 gap-4 mb-2"><div className="bg-gray-50 p-3 rounded border"><div className="text-xs text-gray-500">权重</div><div className="font-bold text-xl text-blue-600">x {count <= 9 ? count : '-'}</div></div><div className="bg-gray-50 p-3 rounded border"><div className="text-xs text-gray-500">累加和</div><div className="font-bold text-xl text-orange-600">{sum}</div></div></div>
                    <Controls reset={handleReset} next={handleNext} info={finished ? "计算完毕" : "正在累加..."} />
                </div>
            );
        };

        const Visualizer = ({ type }) => {
            switch (type) {
                case "UPPERCASE_DEMO": return <UppercaseVisualizer />;
                case "SPLIT_DEMO": return <SplitVisualizer />;
                case "HEX_DEMO": return <HexVisualizer />;
                case "FIND_DEMO": return <FindVisualizer />;
                case "REVERSE_SWAP_DEMO": return <ReverseSwapVisualizer />;
                case "ISBN_DEMO": return <IsbnVisualizer />;
                default: return <div className="text-gray-400">模块加载错误</div>;
            }
        };

        // --- 新增：流程图渲染组件 ---
        const FlowchartViewer = ({ steps }) => {
            if (!steps) return <div className="text-gray-400 p-4 text-center">暂无流程图数据</div>;
            
            return (
                <div className="flex flex-col items-center space-y-2 py-6 animate-fade-in-up">
                    {steps.map((step, idx) => (
                        <div key={idx} className="flex flex-col items-center w-full">
                            <div className={`
                                relative px-6 py-3 text-sm font-bold text-center shadow-sm border-2 transition-all hover:scale-105 cursor-default
                                ${step.type === 'terminal' ? 'bg-gray-800 text-white border-gray-800 rounded-full w-32' : ''}
                                ${step.type === 'process' ? 'bg-white text-gray-700 border-blue-200 rounded w-64' : ''}
                                ${step.type === 'decision' ? 'bg-yellow-50 text-yellow-800 border-yellow-300 w-48 rotate-0 transform' : ''} /* 菱形用 CSS 实现较复杂，这里简化为特殊颜色的矩形 */
                                ${step.type === 'io' ? 'bg-green-50 text-green-800 border-green-200 -skew-x-12 w-64' : ''}
                            `}>
                                <div className={step.type === 'io' ? 'skew-x-12' : ''}>
                                    {step.text}
                                </div>
                                {step.branch && (
                                    <div className="absolute -right-16 top-1/2 -translate-y-1/2 text-xs text-gray-400 font-normal">
                                        --{step.branch}-->
                                    </div>
                                )}
                            </div>
                            {idx < steps.length - 1 && (
                                <div className="h-6 w-0.5 bg-gray-300 my-1 relative">
                                    <div className="absolute bottom-0 left-1/2 -translate-x-1/2 w-2 h-2 border-b-2 border-r-2 border-gray-300 rotate-45 transform origin-center"></div>
                                </div>
                            )}
                        </div>
                    ))}
                </div>
            );
        };

        // --- 主应用组件 ---
        const App = () => {
            const [activeSectionId, setActiveSectionId] = useState(sectionsData[0].id);
            const [activeProblemId, setActiveProblemId] = useState(sectionsData[0].problems[0].id);
            const [activeTab, setActiveTab] = useState('logic');

            const currentSection = sectionsData.find(s => s.id === activeSectionId) || sectionsData[0];
            const activeProblem = sectionsData.flatMap(s => s.problems).find(p => p.id === activeProblemId) || sectionsData[0].problems[0];
            const isTheory = currentSection.isTheory;

            useEffect(() => {
                const handleContextMenu = (e) => { e.preventDefault(); return false; };
                const handleKeyDown = (e) => {
                    if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
                        e.preventDefault(); e.stopPropagation(); return false;
                    }
                };
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('keydown', handleKeyDown);
                return () => { document.removeEventListener('contextmenu', handleContextMenu); document.removeEventListener('keydown', handleKeyDown); };
            }, []);

            return (
                <div className="min-h-screen flex flex-col md:flex-row select-none">
                    {/* 左侧导航栏 */}
                    <div className="w-full md:w-72 bg-white border-r border-gray-200 p-4 flex-shrink-0 flex flex-col h-auto md:h-screen sticky top-0 overflow-y-auto justify-between">
                        <div>
                            <div className="mb-6">
                                <h1 className="text-xl font-extrabold text-orange-600 flex items-center gap-2">
                                    <Layers className="text-orange-500" /> 童澄 GESP 专题
                                </h1>
                                <p className="text-xs text-gray-400 mt-1 pl-8">Level 4 - 字符串深度解析</p>
                            </div>
                            <div className="space-y-6">
                                {sectionsData.map(section => (
                                    <div key={section.id}>
                                        <div 
                                            className={`flex items-center gap-2 mb-3 px-2 py-1 rounded-lg cursor-pointer transition-colors ${activeSectionId === section.id ? 'bg-orange-50 text-orange-700' : 'text-gray-500 hover:bg-gray-50'}`}
                                            onClick={() => { setActiveSectionId(section.id); setActiveProblemId(section.problems[0].id); setActiveTab('logic'); }}
                                        >
                                            <BookOpen size={16} /> <span className="font-bold text-sm">{section.name}</span>
                                        </div>
                                        {activeSectionId === section.id && (
                                            <div className="space-y-3 pl-2 border-l-2 border-orange-100 ml-2">
                                                {section.problems.map(problem => (
                                                    <div key={problem.id} onClick={() => setActiveProblemId(problem.id)} className={`cursor-pointer p-3 rounded-lg border text-sm transition-all ${activeProblem.id === problem.id ? 'border-orange-400 bg-orange-50 text-orange-800' : 'border-gray-100 hover:border-orange-200'}`}>
                                                        <div className="font-bold flex items-center gap-2"><span className="text-xs bg-white border px-1 rounded text-gray-400">{problem.id.split('-')[1]}</span> {problem.title}</div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                        {/* 底部版权 */}
                        <div className="text-xs text-gray-300 mt-8 text-center border-t pt-4">
                             © 2025 童澄未来 (Tongcheng Future). <br/>All Rights Reserved.
                        </div>
                    </div>

                    {/* 右侧主内容 */}
                    <div className="flex-1 p-4 md:p-8 bg-orange-50/30 overflow-y-auto">
                        <div className="max-w-4xl mx-auto">
                            {/* 标题区 */}
                            <header className="mb-8">
                                <div className="flex items-center gap-2 text-sm text-orange-600 font-medium mb-2">
                                    <span className="bg-orange-100 px-2 py-0.5 rounded text-xs">{activeProblem.id}</span>
                                    <ChevronRight size={14} /> <span>{activeProblem.tags.join(" / ")}</span>
                                </div>
                                <h2 className="text-3xl font-bold text-gray-900 mb-4">{activeProblem.title}</h2>
                                <p className="text-gray-600 bg-white p-5 rounded-xl border border-gray-200 shadow-sm text-sm md:text-base leading-relaxed">
                                    {activeProblem.desc}
                                </p>
                            </header>

                            {/* 理论页面特供渲染 */}
                            {isTheory ? (
                                <div className="space-y-8 animate-fade-in-up">
                                    {activeProblem.content.map((block, idx) => (
                                        <div key={idx} className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                                            <div className="bg-orange-50 px-6 py-3 border-b border-orange-100 font-bold text-orange-800">{block.title}</div>
                                            <div className="p-6">
                                                {block.type === 'table' && (
                                                    <table className="w-full text-sm text-left">
                                                        <thead className="bg-gray-50 text-gray-600"><tr>{block.headers.map(h=> <th key={h} className="px-4 py-2">{h}</th>)}</tr></thead>
                                                        <tbody className="divide-y divide-gray-100">
                                                            {block.rows.map((r, ri) => <tr key={ri}>{r.map((c, ci) => <td key={ci} className={`px-4 py-3 ${ci===1?'font-mono text-blue-600':''}`}>{c}</td>)}</tr>)}
                                                        </tbody>
                                                    </table>
                                                )}
                                                {block.type === 'code' && (
                                                    <div className="relative">
                                                        <div className="mb-2 text-gray-500 text-sm">{block.desc}</div>
                                                        <pre className="bg-gray-900 text-gray-100 p-4 rounded-lg text-sm font-mono overflow-x-auto"><code>{block.code}</code></pre>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <>
                                    {/* 习题功能 Tab (代码 -> 流程图) */}
                                    <div className="flex items-center gap-4 mb-6 border-b border-gray-200">
                                        <button onClick={() => setActiveTab('logic')} className={`pb-3 px-2 text-sm font-bold flex items-center gap-2 border-b-2 transition-colors ${activeTab === 'logic' ? 'border-orange-500 text-orange-600' : 'border-transparent text-gray-400 hover:text-gray-600'}`}><Lightbulb size={18}/> 解题思路 & 演示</button>
                                        <button onClick={() => setActiveTab('flow')} className={`pb-3 px-2 text-sm font-bold flex items-center gap-2 border-b-2 transition-colors ${activeTab === 'flow' ? 'border-orange-500 text-orange-600' : 'border-transparent text-gray-400 hover:text-gray-600'}`}><GitMerge size={18}/> 程序流程图 (无源码)</button>
                                    </div>

                                    <div className="min-h-[400px]">
                                        {activeTab === 'logic' && (
                                            <div className="space-y-6 animate-fade-in-up">
                                                {activeProblem.pseudo && (
                                                    <div className="bg-gray-800 text-gray-200 p-4 rounded-xl border border-gray-700 shadow-sm mb-6 font-mono text-sm whitespace-pre-wrap leading-relaxed relative">
                                                        <div className="absolute top-2 right-2 text-xs text-gray-500 font-bold uppercase tracking-wider flex items-center gap-1"><Terminal size={12} /> Pseudo-code</div>
                                                        {activeProblem.pseudo}
                                                    </div>
                                                )}
                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    {activeProblem.logic.map((step, idx) => (
                                                        <div key={idx} className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex gap-3">
                                                            <div className="flex-shrink-0 w-6 h-6 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-bold text-sm">{idx + 1}</div>
                                                            <div>
                                                                <h4 className="font-bold text-gray-800 text-sm mb-1">{step.title}</h4>
                                                                <p className="text-gray-600 text-xs leading-relaxed">{step.text}</p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>
                                                {activeProblem.visualType && <Visualizer type={activeProblem.visualType} />}
                                            </div>
                                        )}

                                        {activeTab === 'flow' && (
                                            <div className="relative group animate-fade-in-up bg-white rounded-xl border border-gray-100 p-8 shadow-sm min-h-[400px]">
                                                <div className="absolute top-4 right-4 flex items-center gap-1 text-xs text-orange-400 bg-orange-50 px-2 py-1 rounded">
                                                    <CheckCircle size={12}/> <span>已隐藏源码，请根据流程编写</span>
                                                </div>
                                                <FlowchartViewer steps={activeProblem.flow} />
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
