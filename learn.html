<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童澄未来 · 学习中心</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#FA7800', light: '#fffbf0', hover: '#c2410c' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        
        /* 滚动条优化 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none;  scrollbar-width: none; }

        /* 讲义内容样式重置 (全屏沉浸风) */
        .prose { max-width: none !important; width: 100%; } 
        .prose h1 { font-size: 2.25rem; font-weight: 800; color: #1f2937; margin-bottom: 1.5rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e5e7eb; }
        .prose h2 { font-size: 1.75rem; font-weight: 700; color: #374151; margin-top: 2.5rem; margin-bottom: 1rem; display: flex; align-items: center; }
        .prose h2::before { content: ''; display: block; width: 6px; height: 1.5rem; background: #FA7800; margin-right: 0.75rem; border-radius: 2px; }
        .prose h3 { font-size: 1.4rem; font-weight: 600; color: #4b5563; margin-top: 2rem; margin-bottom: 0.75rem; }
        .prose p { margin-bottom: 1.25rem; line-height: 1.8; color: #374151; font-size: 1.05rem; }
        .prose pre { background: #f8fafc; padding: 1.5rem; border-radius: 0.5rem; overflow-x: auto; border: 1px solid #e2e8f0; margin: 1.5rem 0; font-family: Consolas, Monaco, monospace; }
        .prose code { background: #fff7ed; color: #c2410c; padding: 0.2rem 0.4rem; border-radius: 0.25rem; font-size: 0.9em; font-weight: 500; font-family: Consolas, monospace; }
        .prose ul, .prose ol { margin-bottom: 1.25rem; padding-left: 1.5rem; color: #374151; }
        .prose ul { list-style-type: disc; }
        .prose ol { list-style-type: decimal; }
        .prose li { margin-bottom: 0.5rem; }
        .prose blockquote { border-left: 4px solid #fed7aa; background: #fffbf0; padding: 1rem 1.5rem; border-radius: 0 0.5rem 0.5rem 0; color: #7c2d12; font-style: italic; margin: 1.5rem 0; }
        .prose img { margin: 2rem auto; border-radius: 0.75rem; border: 1px solid #f3f4f6; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05); }
        .prose iframe { width: 100%; border-radius: 0.75rem; border: 1px solid #e5e7eb; margin: 2rem 0; min-height: 500px; } 

        /* 题目卡片悬停特效 */
        .problem-card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="bg-white h-screen flex flex-col overflow-hidden text-gray-800">

    <header class="h-14 bg-white border-b border-gray-100 flex items-center justify-between px-4 lg:px-6 shrink-0 z-40 relative">
        <div class="flex items-center gap-3">
            <img src="assets/logo.png" alt="Logo" class="w-8 h-8 rounded-md object-cover">
            <span class="font-bold text-gray-800 text-lg tracking-tight">学习中心</span>
        </div>
        <div class="flex gap-4 text-sm items-center font-medium">
            <a href="index.html" class="text-gray-500 hover:text-brand transition">首页</a>
            <span id="user-display" class="px-3 py-1 bg-gray-100 text-gray-600 rounded-full text-xs">访客</span>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden relative">
        
        <aside id="sidebar" class="w-72 bg-gray-50 border-r border-gray-200 flex flex-col z-30 shrink-0 transition-all duration-300">
            <div class="p-3 border-b border-gray-200 bg-white">
                <input type="text" id="search-input" placeholder="搜索课程..." class="w-full text-sm px-3 py-2 bg-gray-50 border border-gray-200 rounded-md focus:outline-none focus:border-brand focus:bg-white transition">
            </div>
            <div class="px-3 py-2 border-b border-gray-200 bg-white flex gap-2 overflow-x-auto no-scrollbar" id="category-tabs"></div>
            <div id="sidebar-list" class="flex-1 overflow-y-auto p-2 space-y-1">
                <div class="text-center text-xs text-gray-400 mt-20">加载中...</div>
            </div>
        </aside>

        <main class="flex-1 flex flex-col bg-white relative h-full w-full min-w-0">
            
            <div class="h-12 border-b border-gray-100 flex items-center justify-between px-4 bg-white/95 backdrop-blur shrink-0 z-20">
                <div class="flex items-center gap-4 h-full">
                    <button onclick="toggleSidebar()" class="p-1.5 text-gray-400 hover:text-brand hover:bg-orange-50 rounded transition" title="折叠目录">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
                        </svg>
                    </button>
                    <div class="h-4 w-px bg-gray-200"></div>
                    <div class="flex gap-6 h-full">
                        <button onclick="setTab('handout')" id="tab-handout" class="h-full border-b-2 border-brand text-brand font-bold px-1 text-sm transition flex items-center gap-2">
                            <span>📖</span> 讲义
                        </button>
                        <button onclick="setTab('practice')" id="tab-practice" class="h-full border-b-2 border-transparent text-gray-500 hover:text-brand px-1 text-sm transition flex items-center gap-2">
                            <span>🎯</span> 训练 <span id="practice-count" class="bg-gray-100 text-gray-500 text-[10px] px-1.5 py-0.5 rounded-full">0</span>
                        </button>
                    </div>
                </div>
                <div class="hidden md:flex items-center gap-2 text-xs text-gray-400">
                    <span>F11 全屏模式</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto bg-white scroll-smooth p-0 relative">
                <div class="w-full h-full px-6 py-8 md:px-10 md:py-10 lg:px-16 max-w-screen-2xl mx-auto">
                    
                    <div id="view-handout" class="prose prose-lg text-gray-700 pb-20">
                        <div class="flex flex-col items-center justify-center py-32 text-gray-300 select-none">
                            <svg class="w-20 h-20 mb-6 text-gray-100" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path></svg>
                            <p class="text-lg font-medium">请在左侧选择课程</p>
                            <p class="text-sm mt-2 text-gray-400">开启您的信奥学习之旅</p>
                        </div>
                    </div>

                    <div id="view-practice" class="hidden">
                        <div class="flex items-center justify-between mb-8 pb-4 border-b border-gray-100">
                            <div>
                                <h2 class="text-2xl font-bold text-gray-800">本节专项训练</h2>
                                <p class="text-gray-500 text-sm mt-1">完成题目以巩固知识点，系统将自动记录您的做题进度。</p>
                            </div>
                        </div>
                        <div id="practice-list" class="grid gap-6 grid-cols-1 md:grid-cols-2 xl:grid-cols-3 pb-20"></div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <div id="quiz-modal" class="fixed inset-0 bg-black/60 hidden flex items-center justify-center z-50 backdrop-blur-sm transition-all duration-300">
        <div class="bg-white w-full max-w-2xl mx-4 rounded-xl shadow-2xl overflow-hidden transform scale-100 transition-all" id="quiz-box">
            <div class="bg-gray-50 px-6 py-4 border-b border-gray-200 flex justify-between items-center">
                <div class="flex items-center gap-2">
                    <span class="bg-brand text-white text-xs px-2 py-1 rounded font-bold">练习模式</span>
                    <h3 class="font-bold text-gray-800 text-lg">专项练习</h3>
                </div>
                <button onclick="closeQuiz()" class="text-gray-400 hover:text-gray-700 text-2xl leading-none">&times;</button>
            </div>
            <div class="p-8 max-h-[70vh] overflow-y-auto">
                <div id="quiz-title" class="text-xl font-bold text-gray-800 mb-8 leading-relaxed"></div>
                <div id="quiz-options" class="space-y-4"></div>
                <div id="quiz-feedback" class="hidden mt-8 p-6 rounded-xl bg-gray-50 border border-gray-200 text-base leading-relaxed animate-fade-in"></div>
            </div>
            <div class="px-8 py-5 bg-gray-50 border-t border-gray-200 flex justify-end gap-4">
                <button onclick="closeQuiz()" class="px-6 py-2.5 text-gray-600 hover:bg-gray-200 rounded-lg transition font-medium">关闭</button>
                <button id="btn-submit-answer" class="px-8 py-2.5 bg-brand text-white font-bold rounded-lg hover:bg-orange-600 shadow-lg shadow-orange-100 transition disabled:opacity-50 disabled:cursor-not-allowed">
                    提交答案
                </button>
            </div>
        </div>
    </div>

    <script type="module">
        import supabase from './client.js';

        let allTopics = [];
        let currentTopicId = null;
        let activeCategory = '全部'; 
        let currentProblems = []; 
        let activeProblem = null; 

        // 初始化
        (async () => {
            // 1. 鉴权
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = `login.html?redirect=learn.html`;
                return;
            }

            // 2. 用户信息 & 角色获取
            const userEl = document.getElementById('user-display');
            if (userEl) {
                userEl.textContent = user.email.split('@')[0];
                
                const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
                const role = profile?.role || 'free_user';
                window.userRole = role; // 存入全局，核心！

                if (role === 'paid_user' || role === 'admin') {
                    userEl.className = "px-3 py-1 bg-yellow-100 text-yellow-700 border border-yellow-200 rounded-full text-xs font-bold flex items-center gap-1";
                    userEl.innerHTML += ' <span>PRO</span>';
                }
            }
            await loadSidebar();
        })();

        // 加载侧边栏
        async function loadSidebar() {
            // 记得去 Supabase 运行 SQL: ALTER TABLE topics ADD COLUMN IF NOT EXISTS is_free BOOLEAN DEFAULT false;
            const { data, error } = await supabase.from('topics').select('*').order('category').order('order_no');
            if(error) return console.error(error);
            allTopics = data;
            renderSidebar();
        }

        // 渲染侧边栏
        function renderSidebar() {
            const categories = ['全部', ...new Set(allTopics.map(t => t.category || '未分类'))];
            const tabContainer = document.getElementById('category-tabs');
            tabContainer.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = `whitespace-nowrap px-3 py-1.5 text-xs rounded-md border transition font-medium ${
                    cat === activeCategory 
                    ? 'bg-gray-800 text-white border-gray-800 shadow-sm' 
                    : 'bg-white text-gray-500 border-gray-200 hover:border-brand hover:text-brand'
                }`;
                btn.textContent = cat;
                btn.onclick = () => {
                    activeCategory = cat;
                    renderSidebar();
                };
                tabContainer.appendChild(btn);
            });
            filterAndRenderList();
        }

        // 筛选并渲染列表
        function filterAndRenderList() {
            const listEl = document.getElementById('sidebar-list');
            const searchKey = document.getElementById('search-input').value.toLowerCase();
            listEl.innerHTML = '';

            const filtered = allTopics.filter(t => {
                const matchCat = activeCategory === '全部' || (t.category || '未分类') === activeCategory;
                const matchSearch = t.name.toLowerCase().includes(searchKey);
                return matchCat && matchSearch;
            });

            if (filtered.length === 0) {
                listEl.innerHTML = `<div class="text-center text-xs text-gray-400 mt-10">暂无相关课程</div>`;
                return;
            }

            filtered.forEach(t => {
                const btn = document.createElement('div');
                const isActive = (currentTopicId === t.id);
                
                // 判断是否有权访问
                const isLocked = !((window.userRole === 'admin' || window.userRole === 'paid_user') || t.is_free);
                const lockIcon = isLocked ? '<span class="text-gray-300 ml-auto text-xs">🔒</span>' : '';

                btn.className = `cursor-pointer px-3 py-3 mb-1 rounded-lg text-sm transition flex justify-between items-center border-l-4 ${
                    isActive 
                    ? 'bg-orange-50 text-brand font-bold border-brand' 
                    : 'border-transparent text-gray-600 hover:bg-gray-50 hover:text-gray-900'
                }`;
                
                const levelBadge = t.level > 1 ? `<span class="text-[10px] px-1.5 py-0.5 rounded bg-white border border-gray-100 text-gray-400 ml-2">Lv.${t.level}</span>` : '';
                
                // 结构: 名字 + 等级 + 锁
                btn.innerHTML = `<div class="flex items-center truncate"><span>${t.name}</span>${levelBadge}</div> ${lockIcon}`;
                
                btn.onclick = () => window.loadTopic(t.id);
                listEl.appendChild(btn);
            });
        }

        // 加载课程内容 (包含锁屏逻辑)
        window.loadTopic = async (id) => {
            currentTopicId = id;
            filterAndRenderList(); 

            const topic = allTopics.find(t => t.id === id);
            const viewHandout = document.getElementById('view-handout');
            
            // 🔐 权限判断
            const canAccess = (window.userRole === 'admin' || window.userRole === 'paid_user') || topic.is_free;

            if (canAccess) {
                // ✅ 允许访问
                viewHandout.innerHTML = `<div class="animate-fade-in">${topic.content ? marked.parse(topic.content) : '<div class="text-gray-400 italic p-10 text-center">本节暂无讲义内容...</div>'}</div>`;
                
                // 启用题目 Tab
                document.getElementById('tab-practice').disabled = false;
                document.getElementById('tab-practice').classList.remove('opacity-50', 'cursor-not-allowed');
                
                loadProblems(id);
            } else {
                // 🔒 禁止访问 (锁屏界面)
                viewHandout.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-20 animate-fade-in">
                        <div class="bg-orange-50 p-6 rounded-full mb-6">
                            <svg class="w-16 h-16 text-brand" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg>
                        </div>
                        <h2 class="text-2xl font-bold text-gray-800 mb-3">本节课程需要会员权限</h2>
                        <p class="text-gray-500 mb-8 max-w-md text-center">开通会员即可解锁全部 ${allTopics.length} 节课程讲义、交互式课件及配套真题训练。</p>
                        <a href="upgrade.html" class="px-8 py-3 bg-brand text-white font-bold rounded-xl hover:bg-orange-600 shadow-lg shadow-orange-200 transition transform hover:-translate-y-1">
                            立即升级会员
                        </a>
                    </div>
                `;
                // 禁用题目 Tab
                document.getElementById('tab-practice').disabled = true;
                document.getElementById('tab-practice').classList.add('opacity-50', 'cursor-not-allowed');
                setTab('handout'); // 强制切回讲义
                document.getElementById('practice-list').innerHTML = ''; // 清空题目
                document.getElementById('practice-count').textContent = '0';
            }
        }

        // 加载题目
        async function loadProblems(tid) {
            const listEl = document.getElementById('practice-list');
            const countEl = document.getElementById('practice-count');
            
            const { data, error } = await supabase.from('problems').select('*').eq('topic_id', tid).order('id');

            if (error) { console.error(error); return; }

            currentProblems = data || [];
            countEl.textContent = currentProblems.length;

            listEl.innerHTML = '';
            if (currentProblems.length === 0) {
                listEl.innerHTML = '<div class="col-span-full text-center py-20 text-gray-400 bg-gray-50 rounded-xl border border-dashed border-gray-200">本章节暂无练习题</div>';
                return;
            }

            currentProblems.forEach((p, index) => {
                const el = document.createElement('div');
                let diffClass = 'bg-gray-100 text-gray-500';
                let diffText = '中等';
                if (p.difficulty === 'easy') { diffClass = 'bg-green-50 text-green-700 border border-green-100'; diffText = '简单'; }
                else if (p.difficulty === 'hard') { diffClass = 'bg-red-50 text-red-700 border border-red-100'; diffText = '困难'; }

                el.className = 'problem-card p-6 border border-gray-200 rounded-xl hover:border-brand transition bg-white flex flex-col justify-between h-full';
                el.innerHTML = `
                    <div class="mb-4">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-mono text-gray-400">#${index + 1}</span>
                            <span class="text-xs px-2 py-0.5 rounded ${diffClass}">${diffText}</span>
                        </div>
                        <div class="font-bold text-gray-800 text-lg line-clamp-2">${p.title}</div>
                    </div>
                    <button class="w-full py-2 bg-white border border-brand text-brand font-bold rounded-lg hover:bg-brand hover:text-white transition shadow-sm mt-auto" 
                        onclick="window.openQuiz(${p.id})">
                        开始挑战
                    </button>
                `;
                listEl.appendChild(el);
            });
        }

        // 答题弹窗逻辑
        window.openQuiz = (pid) => {
            const p = currentProblems.find(item => item.id === pid);
            if (!p) return;
            activeProblem = p;
            
            document.getElementById('quiz-title').textContent = p.title;
            const optContainer = document.getElementById('quiz-options');
            optContainer.innerHTML = '';

            p.options.forEach((optText, idx) => {
                const label = document.createElement('label');
                label.className = 'flex items-start p-4 border border-gray-200 rounded-xl cursor-pointer hover:bg-orange-50 hover:border-orange-200 transition select-none group bg-white';
                label.innerHTML = `
                    <div class="flex items-center h-6">
                        <input type="radio" name="quiz-opt" value="${idx}" class="w-5 h-5 text-brand border-gray-300 focus:ring-brand transition mt-0.5">
                    </div>
                    <div class="ml-3">
                        <span class="font-bold text-gray-400 mr-2 group-hover:text-brand text-lg">${String.fromCharCode(65 + idx)}.</span>
                        <span class="text-gray-700 font-medium text-lg leading-relaxed">${optText}</span>
                    </div>
                `;
                optContainer.appendChild(label);
            });

            document.getElementById('quiz-feedback').classList.add('hidden');
            const btn = document.getElementById('btn-submit-answer');
            btn.textContent = '提交答案';
            btn.disabled = false;
            btn.className = "px-8 py-2.5 bg-brand text-white font-bold rounded-lg hover:bg-orange-600 shadow-lg shadow-orange-100 transition disabled:opacity-50 disabled:cursor-not-allowed";
            btn.onclick = submitAnswer;
            document.getElementById('quiz-modal').classList.remove('hidden');
        }

        window.closeQuiz = () => document.getElementById('quiz-modal').classList.add('hidden');

        async function submitAnswer() {
            const selected = document.querySelector('input[name="quiz-opt"]:checked');
            if (!selected) return alert('请先选择一个选项！');

            const userChoice = parseInt(selected.value);
            const isCorrect = (userChoice === activeProblem.correct_answer_index);
            const btn = document.getElementById('btn-submit-answer');
            
            btn.disabled = true;
            btn.textContent = '判题中...';

            const { data: { user } } = await supabase.auth.getUser();
            if (user) {
                await supabase.from('user_submissions').insert([{
                    user_id: user.id, problem_id: activeProblem.id,
                    user_answer_index: userChoice, is_correct: isCorrect
                }]);
            }

            const feedbackEl = document.getElementById('quiz-feedback');
            feedbackEl.classList.remove('hidden');
            
            if (isCorrect) {
                feedbackEl.className = 'mt-8 p-6 rounded-xl bg-green-50 border border-green-200 text-green-800 animate-fade-in';
                feedbackEl.innerHTML = `<div class="font-bold text-xl mb-3 flex items-center gap-2 text-green-700"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> 回答正确！</div>${activeProblem.analysis ? `<div class="text-base border-t border-green-200 pt-4 mt-2 text-green-900 leading-relaxed"><strong>💡 解析：</strong>${activeProblem.analysis}</div>` : ''}`;
                btn.className = "px-8 py-2.5 bg-green-600 text-white font-bold rounded-lg cursor-default";
                btn.textContent = '🎉 已完成';
            } else {
                feedbackEl.className = 'mt-8 p-6 rounded-xl bg-red-50 border border-red-200 text-red-800 animate-fade-in';
                const correctLetter = String.fromCharCode(65 + activeProblem.correct_answer_index);
                const correctText = activeProblem.options[activeProblem.correct_answer_index];
                feedbackEl.innerHTML = `<div class="font-bold text-xl mb-3 flex items-center gap-2 text-red-700"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg> 回答错误</div><div class="mb-3 text-lg">正确答案是：<strong>${correctLetter}. ${correctText}</strong></div>${activeProblem.analysis ? `<div class="text-base border-t border-red-200 pt-4 mt-2 text-red-900 leading-relaxed"><strong>💡 解析：</strong>${activeProblem.analysis}</div>` : ''}`;
                btn.className = "px-8 py-2.5 bg-gray-400 text-white font-bold rounded-lg cursor-default";
                btn.textContent = '再接再厉';
            }
        }

        // 侧边栏折叠
        window.toggleSidebar = () => {
            const sb = document.getElementById('sidebar');
            if (sb.style.width === '0px') {
                sb.style.width = '18rem'; 
                sb.classList.remove('w-0', 'opacity-0', 'overflow-hidden');
            } else {
                sb.style.width = '0px'; 
                sb.classList.add('w-0', 'opacity-0', 'overflow-hidden');
            }
        }

        // Tab 切换
        window.setTab = (t) => {
            const h = document.getElementById('view-handout'), p = document.getElementById('view-practice');
            const btH = document.getElementById('tab-handout'), btP = document.getElementById('tab-practice');
            if(t==='handout'){
                h.classList.remove('hidden'); p.classList.add('hidden');
                btH.classList.add('border-brand','text-brand'); btH.classList.remove('border-transparent','text-gray-500');
                btP.classList.remove('border-brand','text-brand'); btP.classList.add('border-transparent','text-gray-500');
            } else {
                p.classList.remove('hidden'); h.classList.add('hidden');
                btP.classList.add('border-brand','text-brand'); btP.classList.remove('border-transparent','text-gray-500');
                btH.classList.remove('border-brand','text-brand'); btH.classList.add('border-transparent','text-gray-500');
            }
        }

        document.getElementById('search-input').addEventListener('input', () => filterAndRenderList());
    </script>
</body>
</html>
