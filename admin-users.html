<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员权限管理 - 童澄 CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: '#FA7800', hover: '#c2410c' } } } } }
    </script>
    <style>
        body{background:#f8fafc}
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #FA7800; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        /* 模态框样式 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; z-index: 100; }
        .modal.show { display: flex; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 px-6 h-16 flex justify-between items-center shadow-sm shrink-0 z-50">
        <div class="flex items-center gap-8">
            <div class="font-bold text-gray-800 text-lg flex items-center gap-2">
                <img src="assets/logo.png" class="w-7 h-7 rounded object-cover">
                童澄后台
            </div>
            <nav class="flex bg-gray-100 p-1 rounded-lg">
                <a href="admin-content.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">📚 内容管理</a>
                <a href="admin-problems.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">✍️ 题库录入</a>
                <a href="admin-orders.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">💰 订单审核</a>
                <a href="admin-users.html" class="px-4 py-1.5 rounded-md text-sm font-bold bg-white text-orange-600 shadow-sm transition">👥 人员权限</a>
            </nav>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded font-bold">管理员模式</span>
            <a href="index.html" class="text-gray-400 hover:text-gray-600 transition">退出后台</a>
        </div>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto p-6">
        
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">用户花名册</h2>
                <p class="text-gray-500 text-sm mt-1">管理所有注册用户的角色与权限</p>
            </div>
            <div class="flex gap-3">
                <button onclick="openBatchModal()" class="bg-brand text-white px-4 py-2 rounded-lg hover:bg-brand-hover transition text-sm font-bold flex items-center gap-2 shadow-sm">
                    ⚡ 批量注册学员
                </button>
                <input type="text" id="filter-input" placeholder="搜索邮箱..." class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand outline-none w-64">
                <button onclick="loadAllUsers()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 transition text-sm font-bold flex items-center gap-2">
                    🔄 刷新
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 text-gray-500 font-bold border-b border-gray-200">
                    <tr>
                        <th class="py-4 px-6 w-1/3">用户邮箱 / ID</th>
                        <th class="py-4 px-6">注册时间</th>
                        <th class="py-4 px-6">当前角色</th>
                        <th class="py-4 px-6 text-right">操作 (修改权限)</th>
                    </tr>
                </thead>
                <tbody id="user-list-body">
                    <tr><td colspan="4" class="py-10 text-center text-gray-400">正在加载数据...</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <div id="batch-modal" class="modal">
        <div class="bg-white rounded-xl shadow-xl w-[600px] p-6 relative">
            <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">批量导入学员账号</h3>
            
            <div class="bg-yellow-50 text-yellow-700 p-3 rounded text-xs mb-4 border border-yellow-200">
                <strong>📝 格式说明：</strong> 请每行输入一个账号，格式为 <b>邮箱,密码</b> (中间用英文逗号)。<br>
                默认角色为“免费学员 (free_user)”。
            </div>

            <textarea id="batch-input" rows="8" class="w-full border border-gray-300 rounded-lg p-3 text-sm font-mono focus:ring-2 focus:ring-brand outline-none mb-4" placeholder="student01@test.com,123456&#10;student02@test.com,123456"></textarea>
            
            <div id="batch-result" class="text-sm mb-4 max-h-32 overflow-y-auto hidden"></div>

            <div class="flex justify-end gap-3">
                <button onclick="closeBatchModal()" class="px-4 py-2 text-gray-600 hover:bg-gray-100 rounded font-bold">取消</button>
                <button onclick="handleBatchRegister()" class="px-6 py-2 bg-brand text-white rounded font-bold hover:bg-brand-hover shadow-md transition">开始导入</button>
            </div>
        </div>
    </div>

    <script type="module">
        import supabase from './client.js';

        let allUsers = [];
        let currentAdminId = null;

        // 初始化
        (async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return location.href = 'login.html';
            currentAdminId = user.id;

            const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
            if (profile?.role !== 'admin') {
                alert('权限不足');
                return location.href = 'index.html';
            }

            loadAllUsers();
        })();

        // 加载所有用户
        window.loadAllUsers = async () => {
            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = '<tr><td colspan="4" class="py-10 text-center text-gray-400"><div class="flex justify-center items-center gap-2"><div class="loader"></div> 正在从数据库拉取名单...</div></td></tr>';

            const { data, error } = await supabase.rpc('get_all_users');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-red-500">加载失败: ${error.message}</td></tr>`;
                return;
            }

            allUsers = data || [];
            renderList(allUsers);
        }

        function renderList(users) {
            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-10 text-center text-gray-400">暂无用户</td></tr>';
                return;
            }

            users.forEach(u => {
                const row = document.createElement('tr');
                row.className = "border-b border-gray-50 hover:bg-orange-50/30 transition group";
                
                let roleBadge = '';
                if (u.role === 'admin') roleBadge = '<span class="bg-red-100 text-red-700 px-2 py-1 rounded-md text-xs font-bold border border-red-200">👑 管理员</span>';
                else if (u.role === 'teacher') roleBadge = '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-md text-xs font-bold border border-blue-200">🧑‍🏫 老师</span>';
                else if (u.role === 'paid_user') roleBadge = '<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-md text-xs font-bold border border-yellow-200">💎 Pro会员</span>';
                else roleBadge = '<span class="bg-gray-100 text-gray-500 px-2 py-1 rounded-md text-xs font-bold border border-gray-200">🌱 免费</span>';

                let actions = '';
                if (u.id === currentAdminId) {
                    actions = '<span class="text-gray-400 italic text-xs mr-2">当前登录</span>';
                } else {
                    actions = `
                        <div class="flex items-center justify-end gap-2">
                            <select onchange="changeRole('${u.id}', '${u.email}', this.value)" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white hover:border-brand focus:outline-none cursor-pointer">
                                <option value="" disabled selected>⚡ 变更...</option>
                                <option value="free_user">🌱 降级为免费</option>
                                <option value="paid_user">💎 设为 Pro会员</option>
                                <option value="teacher">🧑‍🏫 设为老师</option>
                                <option value="admin">👑 设为管理员</option>
                            </select>
                            // 在 actions 变量里添加按钮
                            <button onclick="resetPassword('${u.id}', '${u.email}')" class="text-xs bg-blue-50 text-blue-600 px-3 py-1 rounded border border-blue-100 hover:bg-blue-600 hover:text-white transition">
                                🔑 改密
                            </button>
                            <button onclick="deleteUser('${u.id}', '${u.email}')" class="text-xs bg-red-50 text-red-600 px-3 py-1 rounded border border-red-100 hover:bg-red-600 hover:text-white transition">
                                删除
                            </button>
                        </div>
                    `;
                }

                row.innerHTML = `
                    <td class="py-4 px-6">
                        <div class="font-bold text-gray-800 text-base">${u.email}</div>
                        <div class="text-xs text-gray-400 font-mono mt-0.5">${u.id}</div>
                    </td>
                    <td class="py-4 px-6 text-gray-500">${new Date(u.created_at).toLocaleDateString()}</td>
                    <td class="py-4 px-6">${roleBadge}</td>
                    <td class="py-4 px-6 text-right">${actions}</td>
                `;
                tbody.appendChild(row);
            });
        }

        window.changeRole = async (uid, email, newRole) => {
            const roleNames = { 'free_user': '免费用户', 'paid_user': 'Pro会员', 'teacher': '教研老师', 'admin': '管理员' };
            if (!confirm(`确认要将用户 [${email}] 的身份修改为 【${roleNames[newRole]}】 吗？`)) {
                loadAllUsers(); return;
            }
            const { error } = await supabase.rpc('admin_set_role', { target_user_id: uid, new_role: newRole });
            if (error) alert('修改失败: ' + error.message);
            else loadAllUsers(); 
        }

        document.getElementById('filter-input').addEventListener('input', (e) => {
            const key = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => u.email.toLowerCase().includes(key) || u.id.includes(key));
            renderList(filtered);
        });

        // --- 批量注册逻辑 ---
        window.openBatchModal = () => {
            document.getElementById('batch-modal').classList.add('show');
            document.getElementById('batch-input').value = '';
            document.getElementById('batch-result').classList.add('hidden');
        }
        window.closeBatchModal = () => document.getElementById('batch-modal').classList.remove('show');

        window.handleBatchRegister = async () => {
            const input = document.getElementById('batch-input').value.trim();
            if (!input) return alert('请输入账号信息');

            const lines = input.split('\n');
            const resultDiv = document.getElementById('batch-result');
            resultDiv.classList.remove('hidden');
            resultDiv.innerHTML = '<div class="text-blue-500">⏳ 正在处理中，请稍候...</div>';

            let successCount = 0;
            let failCount = 0;
            let logs = '';

            for (const line of lines) {
                const [email, password] = line.split(',').map(s => s.trim());
                if (!email || !password) continue;

                // [核心] 调用我们在第一步创建的 SQL 函数
                const { data, error } = await supabase.rpc('admin_create_user', {
                    new_email: email,
                    new_password: password,
                    new_role: 'free_user' // 默认创建为免费学员
                });

                if (error) {
                    failCount++;
                    logs += `<div class="text-red-500 text-xs">❌ ${email}: ${error.message}</div>`;
                } else {
                    successCount++;
                    logs += `<div class="text-green-600 text-xs">✅ ${email}: 创建成功</div>`;
                }
            }

            resultDiv.innerHTML = `
                <div class="font-bold mb-2">处理完成：成功 ${successCount} / 失败 ${failCount}</div>
                <div class="bg-gray-50 p-2 rounded border border-gray-100 h-24 overflow-y-auto">${logs}</div>
            `;
            
            if (successCount > 0) loadAllUsers();
        }
        // [!!] 新增：删除用户逻辑
        window.deleteUser = async (uid, email) => {
            // 1. 二次确认，防止手滑
            const confirmMsg = `⚠️ 高危操作警告！\n\n确定要彻底删除用户 [${email}] 吗？\n此操作无法撤销，该用户的所有数据将被清除。`;
            if (!confirm(confirmMsg)) return;

            // 2. 调用后端 SQL 函数
            const { error } = await supabase.rpc('admin_delete_user', {
                target_user_id: uid
            });

            if (error) {
                alert('删除失败: ' + error.message);
            } else {
                // alert('用户已删除'); // 可选：不弹窗直接刷新体验更好
                loadAllUsers(); // 刷新列表
            }
        }
        window.resetPassword = async (uid, email) => {
            const newPwd = prompt(`请输入用户 [${email}] 的新密码：`);
            if (!newPwd || newPwd.trim().length < 6) {
                if(newPwd !== null) alert('密码长度至少 6 位');
                return;
            }
            
            const { error } = await supabase.rpc('admin_reset_password', {
                target_user_id: uid,
                new_password: newPwd.trim()
            });

            if (error) alert('修改失败: ' + error.message);
            else alert('✅ 密码修改成功！');
        }
    </script>
</body>
</html>
