<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员权限管理 - 童澄 CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: '#FA7800', hover: '#c2410c' } } } } }
    </script>
    <style>
        body{background:#f8fafc}
        /* 3. 补上微弹跳动画 CSS */
        @keyframes bounceShort {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-5px); }
        }
        .animate-bounce-short {
            animation: bounceShort 0.5s ease-in-out 1; /* 只跳一次 */
        }
        /* 淡入动画 */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.3s ease-out forwards; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 px-6 h-16 flex justify-between items-center shadow-sm shrink-0 z-50">
        <div class="flex items-center gap-8">
            <div class="font-bold text-gray-800 text-lg flex items-center gap-2">
                <img src="assets/logo.png" class="w-7 h-7 rounded object-cover">
                童澄后台
            </div>
            
            <nav class="flex bg-gray-100 p-1 rounded-lg">
                <a href="admin-content.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                    📚 内容管理
                </a>
                <a href="admin-problems.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                    ✍️ 题库录入
                </a>
                <a href="admin-orders.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                    💰 订单审核
                </a>
                <a href="admin-users.html" class="px-4 py-1.5 rounded-md text-sm font-bold bg-white text-orange-600 shadow-sm transition">
                    👥 人员权限
                </a>
            </nav>
        </div>

        <div class="flex items-center gap-4 text-sm">
            <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded font-bold">管理员模式</span>
            <a href="index.html" class="text-gray-400 hover:text-gray-600 transition">退出后台</a>
        </div>
    </header>

    <main class="flex-1 max-w-3xl w-full mx-auto p-6 mt-10">
        
        <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-8">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-gray-800">人员权限配置</h2>
                <p class="text-gray-400 text-sm mt-2">搜索用户邮箱，手动分配系统角色</p>
            </div>

            <div class="flex gap-3 mb-8">
                <input type="email" id="search-email" placeholder="输入完整的用户邮箱 (例如: teacher@example.com)" 
                    class="flex-1 border border-gray-300 rounded-lg px-4 py-3 focus:ring-2 focus:ring-brand focus:border-brand outline-none transition shadow-sm">
                <button onclick="searchUser()" class="bg-gray-800 text-white px-6 py-3 rounded-lg hover:bg-gray-700 transition font-bold shadow-md">查找用户</button>
            </div>

            <div id="result-area" class="hidden animate-fade-in">
                <div class="border-t border-gray-100 pt-6 mb-6">
                    <div class="flex items-center justify-between bg-gray-50 p-5 rounded-xl border border-gray-100">
                        <div>
                            <div class="text-xs text-gray-400 uppercase font-bold mb-1">目标用户</div>
                            <div id="target-email" class="text-lg font-bold text-gray-800"></div>
                            <div id="target-id" class="text-xs text-gray-300 font-mono mt-1"></div>
                        </div>
                        <div class="text-right">
                            <div class="text-xs text-gray-400 uppercase font-bold mb-1">当前角色</div>
                            <span id="current-role" class="px-3 py-1 rounded-full text-sm font-bold bg-white border border-gray-200 text-gray-500">Loading...</span>
                        </div>
                    </div>
                </div>

                <div class="mb-4 text-xs font-bold text-gray-400 uppercase tracking-wider">角色分配操作</div>

                <div class="grid grid-cols-2 gap-4">
                    <button onclick="setRole('admin')" class="group relative p-4 border border-red-100 bg-red-50/50 rounded-xl hover:bg-red-50 transition text-left flex items-center gap-3 hover:shadow-md">
                        <div class="w-10 h-10 rounded-full bg-red-100 text-red-600 flex items-center justify-center text-xl">👑</div>
                        <div>
                            <div class="font-bold text-red-800">设为系统管理员</div>
                            <div class="text-xs text-red-600/70">拥有所有模块的读写权限</div>
                        </div>
                    </button>
                    
                    <button onclick="setRole('teacher')" class="group relative p-4 border border-blue-100 bg-blue-50/50 rounded-xl hover:bg-blue-50 transition text-left flex items-center gap-3 hover:shadow-md">
                        <div class="w-10 h-10 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center text-xl">🧑‍🏫</div>
                        <div>
                            <div class="font-bold text-blue-800">设为教研老师</div>
                            <div class="text-xs text-blue-600/70">仅管理内容与题库</div>
                        </div>
                    </button>

                    <button onclick="setRole('paid_user')" class="group relative p-4 border border-yellow-100 bg-yellow-50/50 rounded-xl hover:bg-yellow-50 transition text-left flex items-center gap-3 hover:shadow-md">
                        <div class="w-10 h-10 rounded-full bg-yellow-100 text-yellow-600 flex items-center justify-center text-xl">💎</div>
                        <div>
                            <div class="font-bold text-yellow-800">设为 PRO 会员</div>
                            <div class="text-xs text-yellow-600/70">解锁所有课程/题目权限</div>
                        </div>
                    </button>

                    <button onclick="setRole('free_user')" class="group relative p-4 border border-gray-200 bg-white rounded-xl hover:bg-gray-50 transition text-left flex items-center gap-3 hover:shadow-md">
                        <div class="w-10 h-10 rounded-full bg-gray-100 text-gray-500 flex items-center justify-center text-xl">🌱</div>
                        <div>
                            <div class="font-bold text-gray-700">降级为免费用户</div>
                            <div class="text-xs text-gray-500">撤销所有特殊权限</div>
                        </div>
                    </button>
                </div>
            </div>

            <div id="msg-box" class="hidden mt-6 text-center text-sm font-bold p-3 rounded-lg"></div>

        </div>
    </main>

    <script type="module">
        import supabase from './client.js';

        let targetUserId = null;
        let currentAdminId = null; // 存储当前管理员ID

        // 1. 严格的管理员检查
        (async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return location.href = 'login.html';
            
            currentAdminId = user.id; // 记录当前登录者 ID

            const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
            if (profile?.role !== 'admin') {
                alert('权限不足：仅系统管理员可访问此页面');
                location.href = (profile?.role === 'teacher') ? 'admin-content.html' : 'index.html';
            }
        })();

        // 2. 查找用户
        window.searchUser = async () => {
            const email = document.getElementById('search-email').value.trim();
            const resultArea = document.getElementById('result-area');
            const msgBox = document.getElementById('msg-box');
            
            resultArea.classList.add('hidden');
            msgBox.classList.add('hidden');

            if (!email) return alert('请输入邮箱');

            const { data: uid, error } = await supabase.rpc('get_user_id_by_email', { user_email: email });

            if (error || !uid) {
                showMsg('❌ 未找到该用户，请检查邮箱拼写。', 'red');
                return;
            }

            targetUserId = uid;
            
            const { data: profile } = await supabase.from('profiles').select('role').eq('id', uid).single();
            
            document.getElementById('target-email').textContent = email;
            document.getElementById('target-id').textContent = uid;
            
            const role = profile?.role || 'free_user';
            const roleBadge = document.getElementById('current-role');
            
            const roleNames = { 'admin': '👑 系统管理员', 'teacher': '🧑‍🏫 教研老师', 'paid_user': '💎 PRO 会员', 'free_user': '🌱 免费用户' };
            
            roleBadge.textContent = roleNames[role] || role;
            
            roleBadge.className = "px-3 py-1 rounded-full text-sm font-bold border " + 
                (role === 'admin' ? "bg-red-50 text-red-600 border-red-100" :
                 role === 'teacher' ? "bg-blue-50 text-blue-600 border-blue-100" :
                 role === 'paid_user' ? "bg-yellow-50 text-yellow-700 border-yellow-100" :
                 "bg-gray-50 text-gray-500 border-gray-200");

            resultArea.classList.remove('hidden');
        }

        // 3. 修改角色
        window.setRole = async (newRole) => {
            if (!targetUserId) return;
            
            // 1. 🚫 防止自己降级/修改自己
            if (targetUserId === currentAdminId) {
                showMsg('❌ 安全保护：不能修改自己的权限！', 'red');
                return;
            }

            const email = document.getElementById('target-email').textContent;
            let warning = `确定要把用户 [${email}] 设为 ${newRole.toUpperCase()} 吗？`;
            if (newRole === 'admin') warning += "\n\n⚠️ 警告：管理员拥有系统最高权限！";
            
            if (!confirm(warning)) return;

            const { error } = await supabase.rpc('admin_set_role', {
                target_user_id: targetUserId,
                new_role: newRole
            });

            if (error) {
                showMsg('修改失败: ' + error.message, 'red');
            } else {
                showMsg(`✅ 修改成功！用户已变更为 ${newRole}`, 'green');
                setTimeout(searchUser, 800);
            }
        }

        // 2. 🎨 修复：使用静态类名映射，防止 Tailwind 丢失类名
        function showMsg(text, colorType) {
            const box = document.getElementById('msg-box');
            box.textContent = text;
            
            // 映射表
            const colorClasses = {
                red: 'bg-red-50 text-red-600 border border-red-100',
                green: 'bg-green-50 text-green-600 border border-green-100',
                blue: 'bg-blue-50 text-blue-600 border border-blue-100'
            };

            // 清除旧类名，添加新类名和动画
            box.className = `mt-6 text-center text-sm font-bold p-3 rounded-lg animate-bounce-short ${colorClasses[colorType] || colorClasses.red}`;
            box.classList.remove('hidden');
        }
    </script>
</body>
</html>
