<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员权限管理 - 童澄 CMS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { theme: { extend: { colors: { brand: { DEFAULT: '#FA7800', hover: '#c2410c' } } } } }
    </script>
    <style>
        body{background:#f8fafc}
        .loader { border: 3px solid #f3f3f3; border-top: 3px solid #FA7800; border-radius: 50%; width: 20px; height: 20px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 px-6 h-16 flex justify-between items-center shadow-sm shrink-0 z-50">
        <div class="flex items-center gap-8">
            <div class="font-bold text-gray-800 text-lg flex items-center gap-2">
                <img src="assets/logo.png" class="w-7 h-7 rounded object-cover">
                童澄后台
            </div>
            <nav class="flex bg-gray-100 p-1 rounded-lg">
                <a href="admin-content.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">📚 内容管理</a>
                <a href="admin-problems.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">✍️ 题库录入</a>
                <a href="admin-orders.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">💰 订单审核</a>
                <a href="admin-users.html" class="px-4 py-1.5 rounded-md text-sm font-bold bg-white text-orange-600 shadow-sm transition">👥 人员权限</a>
            </nav>
        </div>
        <div class="flex items-center gap-4 text-sm">
            <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded font-bold">管理员模式</span>
            <a href="index.html" class="text-gray-400 hover:text-gray-600 transition">退出后台</a>
        </div>
    </header>

    <main class="flex-1 w-full max-w-6xl mx-auto p-6">
        
        <div class="flex justify-between items-end mb-6">
            <div>
                <h2 class="text-2xl font-bold text-gray-800">用户花名册</h2>
                <p class="text-gray-500 text-sm mt-1">管理所有注册用户的角色与权限</p>
            </div>
            <div class="flex gap-3">
                <input type="text" id="filter-input" placeholder="搜索邮箱..." class="border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-brand outline-none w-64">
                <button onclick="loadAllUsers()" class="bg-white border border-gray-300 text-gray-700 px-4 py-2 rounded-lg hover:bg-gray-50 transition text-sm font-bold flex items-center gap-2">
                    🔄 刷新列表
                </button>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
            <table class="w-full text-sm text-left">
                <thead class="bg-gray-50 text-gray-500 font-bold border-b border-gray-200">
                    <tr>
                        <th class="py-4 px-6 w-1/3">用户邮箱 / ID</th>
                        <th class="py-4 px-6">注册时间</th>
                        <th class="py-4 px-6">当前角色</th>
                        <th class="py-4 px-6 text-right">操作 (修改权限)</th>
                    </tr>
                </thead>
                <tbody id="user-list-body">
                    <tr><td colspan="4" class="py-10 text-center text-gray-400">正在加载数据...</td></tr>
                </tbody>
            </table>
        </div>

    </main>

    <script type="module">
        import supabase from './client.js';

        let allUsers = [];
        let currentAdminId = null;

        // 初始化
        (async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return location.href = 'login.html';
            currentAdminId = user.id;

            const { data: profile } = await supabase.from('profiles').select('role').eq('id', user.id).single();
            if (profile?.role !== 'admin') {
                alert('权限不足');
                return location.href = 'index.html';
            }

            loadAllUsers();
        })();

        // 加载所有用户
        window.loadAllUsers = async () => {
            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = '<tr><td colspan="4" class="py-10 text-center text-gray-400"><div class="flex justify-center items-center gap-2"><div class="loader"></div> 正在从数据库拉取名单...</div></td></tr>';

            // 调用后端 RPC 函数
            const { data, error } = await supabase.rpc('get_all_users');

            if (error) {
                tbody.innerHTML = `<tr><td colspan="4" class="py-10 text-center text-red-500">加载失败: ${error.message}</td></tr>`;
                return;
            }

            allUsers = data || [];
            renderList(allUsers);
        }

        // 渲染列表
        function renderList(users) {
            const tbody = document.getElementById('user-list-body');
            tbody.innerHTML = '';

            if (users.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="py-10 text-center text-gray-400">暂无用户</td></tr>';
                return;
            }

            users.forEach(u => {
                const row = document.createElement('tr');
                row.className = "border-b border-gray-50 hover:bg-orange-50/30 transition group";
                
                // 角色样式
                let roleBadge = '';
                if (u.role === 'admin') roleBadge = '<span class="bg-red-100 text-red-700 px-2 py-1 rounded-md text-xs font-bold border border-red-200">👑 管理员</span>';
                else if (u.role === 'teacher') roleBadge = '<span class="bg-blue-100 text-blue-700 px-2 py-1 rounded-md text-xs font-bold border border-blue-200">🧑‍🏫 老师</span>';
                else if (u.role === 'paid_user') roleBadge = '<span class="bg-yellow-100 text-yellow-700 px-2 py-1 rounded-md text-xs font-bold border border-yellow-200">💎 Pro会员</span>';
                else roleBadge = '<span class="bg-gray-100 text-gray-500 px-2 py-1 rounded-md text-xs font-bold border border-gray-200">🌱 免费</span>';

                // 操作按钮 (排除自己)
                let actions = '';
                if (u.id === currentAdminId) {
                    actions = '<span class="text-gray-400 italic text-xs mr-2">当前登录</span>';
                } else {
                    actions = `
                        <select onchange="changeRole('${u.id}', '${u.email}', this.value)" class="text-xs border border-gray-300 rounded px-2 py-1 bg-white hover:border-brand focus:outline-none cursor-pointer">
                            <option value="" disabled selected>⚡ 变更角色...</option>
                            <option value="free_user">🌱 降级为免费</option>
                            <option value="paid_user">💎 设为 Pro会员</option>
                            <option value="teacher">🧑‍🏫 设为老师</option>
                            <option value="admin">👑 设为管理员</option>
                        </select>
                    `;
                }

                row.innerHTML = `
                    <td class="py-4 px-6">
                        <div class="font-bold text-gray-800 text-base">${u.email}</div>
                        <div class="text-xs text-gray-400 font-mono mt-0.5">${u.id}</div>
                    </td>
                    <td class="py-4 px-6 text-gray-500">
                        ${new Date(u.created_at).toLocaleDateString()}
                    </td>
                    <td class="py-4 px-6">
                        ${roleBadge}
                    </td>
                    <td class="py-4 px-6 text-right">
                        ${actions}
                    </td>
                `;
                tbody.appendChild(row);
            });
        }

        // 修改角色逻辑
        window.changeRole = async (uid, email, newRole) => {
            const roleNames = { 'free_user': '免费用户', 'paid_user': 'Pro会员', 'teacher': '教研老师', 'admin': '管理员' };
            
            if (!confirm(`确认要将用户 [${email}] 的身份修改为 【${roleNames[newRole]}】 吗？`)) {
                loadAllUsers(); // 取消则刷新回原样
                return;
            }

            const { error } = await supabase.rpc('admin_set_role', {
                target_user_id: uid,
                new_role: newRole
            });

            if (error) {
                alert('修改失败: ' + error.message);
            } else {
                // 局部刷新 (或者直接刷新全表)
                // alert('修改成功！');
                loadAllUsers(); 
            }
        }

        // 前端搜索过滤
        document.getElementById('filter-input').addEventListener('input', (e) => {
            const key = e.target.value.toLowerCase();
            const filtered = allUsers.filter(u => u.email.toLowerCase().includes(key) || u.id.includes(key));
            renderList(filtered);
        });

    </script>
</body>
</html>
