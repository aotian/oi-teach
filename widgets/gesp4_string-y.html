<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童澄 GESP 专题 (Widget版)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        /* 隐藏滚动条但保留功能 */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        body { background-color: transparent; } /* 背景透明，融入主站 */
        .code-font { font-family: 'Menlo', 'Monaco', monospace; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;
        // ... (Icon 组件保持不变，请保留之前的 Icon 代码) ...
        // 为了节省篇幅，这里假设 IconBase, Layers 等组件已定义
        const IconBase = ({ d, size = 20, className = "" }) => <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}>{d}</svg>;
        const ChevronRight = (p) => <IconBase {...p} d={<polyline points="9 18 15 12 9 6"/>} />;
        const BookOpen = (p) => <IconBase {...p} d={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />;
        // ... (请确保把之前所有的 Icon 组件代码都贴在这里) ...

        // ... (数据 sectionsData 保持不变，请保留) ...
        const sectionsData = [
            // ... (请保留您的完整数据) ...
            {
                id: "intro", name: "预备篇：String 核心", desc: "GESP 4级必备", isTheory: true,
                problems: [ { id: "INTRO-1", title: "基础与常用函数", tags: ["基础"], difficulty: "★", desc: "string 基础。", content: [] } ]
            },
            // ... (这里只是示例，请用您的真实数据覆盖) ...
        ];

        // ... (Visualizer 组件保持不变) ...
        const Visualizer = ({ type }) => <div className="p-4 border rounded bg-gray-50 text-gray-500 text-center">演示组件占位 (请填入真实代码)</div>;

        const App = () => {
            const [activeSectionId, setActiveSectionId] = useState(sectionsData[0].id);
            const [activeProblemId, setActiveProblemId] = useState(sectionsData[0].problems[0].id);
            const [activeTab, setActiveTab] = useState('logic');

            const currentSection = sectionsData.find(s => s.id === activeSectionId) || sectionsData[0];
            const activeProblem = sectionsData.flatMap(s => s.problems).find(p => p.id === activeProblemId) || sectionsData[0].problems[0];
            const isTheory = currentSection.isTheory;

            return (
                <div className="flex flex-col md:flex-row h-screen bg-white rounded-xl overflow-hidden border border-gray-200">
                    
                    {/* 左侧：紧凑型目录 (Widget 专用) */}
                    <div className="w-full md:w-64 bg-gray-50 border-r border-gray-100 flex-shrink-0 overflow-y-auto">
                        <div className="p-4">
                            <div className="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 pl-2">课程目录</div>
                            <div className="space-y-4">
                                {sectionsData.map(section => (
                                    <div key={section.id}>
                                        <div 
                                            className={`flex items-center gap-2 px-3 py-2 rounded-lg cursor-pointer transition-colors ${activeSectionId === section.id ? 'text-orange-700 font-bold bg-orange-100/50' : 'text-gray-600 hover:bg-gray-100'}`}
                                            onClick={() => { setActiveSectionId(section.id); setActiveProblemId(section.problems[0].id); setActiveTab('logic'); }}
                                        >
                                            <BookOpen size={14} className={activeSectionId === section.id ? 'text-orange-500' : 'text-gray-400'} />
                                            <span className="text-sm">{section.name.split('：')[0]}</span>
                                        </div>
                                        
                                        {/* 子菜单 (题目) */}
                                        {activeSectionId === section.id && (
                                            <div className="mt-1 ml-3 pl-3 border-l-2 border-orange-100 space-y-1">
                                                {section.problems.map(problem => (
                                                    <div 
                                                        key={problem.id} 
                                                        onClick={() => setActiveProblemId(problem.id)} 
                                                        className={`cursor-pointer px-3 py-1.5 rounded text-xs transition-all truncate ${
                                                            activeProblem.id === problem.id 
                                                            ? 'text-orange-600 font-medium bg-orange-50' 
                                                            : 'text-gray-500 hover:text-gray-800'
                                                        }`}
                                                    >
                                                        {problem.title}
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>

                    {/* 右侧：主要内容区 */}
                    <div className="flex-1 overflow-y-auto bg-white">
                        <div className="p-6 md:p-10 max-w-4xl mx-auto">
                            {/* 标题 */}
                            <div className="mb-6 border-b border-gray-100 pb-6">
                                <div className="flex items-center gap-2 text-xs text-orange-600 font-medium mb-2">
                                    <span className="bg-orange-50 px-1.5 py-0.5 rounded border border-orange-100">{activeProblem.id}</span>
                                    <ChevronRight size={12} />
                                    <span>{activeProblem.tags?.join(" / ")}</span>
                                </div>
                                <h1 className="text-2xl font-bold text-gray-900 mb-3">{activeProblem.title}</h1>
                                <p className="text-gray-500 text-sm leading-relaxed">{activeProblem.desc}</p>
                            </div>

                            {/* 内容展示 (Tabs + Content) */}
                            {/* ... (这里保留您之前的 activeTab 切换逻辑和 Visualizer 渲染逻辑) ... */}
                            {/* 为了简洁，我把核心渲染区放这里，您直接把之前的逻辑贴回来即可 */}
                            <div className="min-h-[400px]">
                                {isTheory ? (
                                    <div className="space-y-6">
                                        {activeProblem.content?.map((block, idx) => (
                                            <div key={idx} className="border border-gray-100 rounded-xl overflow-hidden shadow-sm">
                                                <div className="bg-gray-50/50 px-4 py-2 border-b border-gray-100 text-sm font-bold text-gray-700">{block.title}</div>
                                                <div className="p-4 text-sm">{block.desc}</div>
                                            </div>
                                        ))}
                                    </div>
                                ) : (
                                    <div className="bg-gray-50 rounded-xl border border-gray-200 p-8 flex items-center justify-center min-h-[300px]">
                                        <Visualizer type={activeProblem.visualType} />
                                    </div>
                                )}
                            </div>
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
