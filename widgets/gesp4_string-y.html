<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童澄 GESP 四级字符串专题训练 (交互增强版)</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React 和 ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <!-- 引入 Babel 用于解析 JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        /* 自定义滚动条样式 - 童澄橙色风格 */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #fff7ed; }
        ::-webkit-scrollbar-thumb { background: #fb923c; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #ea580c; }
        
        body { user-select: none; -webkit-user-select: none; margin: 0; }

        .code-font { font-family: 'Menlo', 'Monaco', 'Courier New', monospace; }
        
        /* 简单的淡入动画 */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.3s ease-out forwards; }
    </style>
</head>

<!-- 重点：背景改成透明，方便融入父页面 -->
<body class="bg-transparent text-gray-800 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // --- 图标组件 ---
        const IconBase = ({ d, size = 20, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size}
                 viewBox="0 0 24 24" fill="none" stroke="currentColor"
                 strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"
                 className={className}>
                {d}
            </svg>
        );
        const Layers = (p) => <IconBase {...p} d={<><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></>} />;
        const Lightbulb = (p) => <IconBase {...p} d={<><path d="M15 14c.2-1 .7-1.7 1.5-2.5 1-1 1.5-2 1.5-3.5A6 6 0 0 0 6 8c0 1 .5 2.2 1.5 3.5.8.7 1.3 1.5 1.5 2.5"/><path d="M9 18h6"/><path d="M10 22h4"/></>} />;
        const Code = (p) => <IconBase {...p} d={<><polyline points="16 18 22 12 16 6"/><polyline points="8 6 2 12 8 18"/></>} />;
        const Cpu = (p) => <IconBase {...p} d={<><rect x="4" y="4" width="16" height="16" rx="2" ry="2"/><rect x="9" y="9" width="6" height="6"/><line x1="9" y1="1" x2="9" y2="4"/><line x1="15" y1="1" x2="15" y2="4"/><line x1="9" y1="20" x2="9" y2="23"/><line x1="15" y1="20" x2="15" y2="23"/><line x1="20" y1="9" x2="23" y2="9"/><line x1="20" y1="14" x2="23" y2="14"/><line x1="1" y1="9" x2="4" y2="9"/><line x1="1" y1="14" x2="4" y2="14"/></>} />;
        const CheckCircle = (p) => <IconBase {...p} d={<><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>} />;
        const ChevronRight = (p) => <IconBase {...p} d={<polyline points="9 18 15 12 9 6"/>} />;
        const BookOpen = (p) => <IconBase {...p} d={<><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>} />;
        const Play = (p) => <IconBase {...p} d={<polygon points="5 3 19 12 5 21 5 3" />} />;
        const RotateCcw = (p) => <IconBase {...p} d={<><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></>} />;
        const Search = (p) => <IconBase {...p} d={<><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></>} />;
        const Terminal = (p) => <IconBase {...p} d={<><polyline points="4 17 10 11 4 5"/><line x1="12" y1="19" x2="20" y2="19"/></>} />;

        // --- 核心数据（原样保留，这里略） ---
        const sectionsData = [/* ... 这里保持你原来的 sectionsData 内容不动 ... */];
        // 为节省篇幅，这里就不重复贴，你直接把自己原来的 sectionsData 整段搬回去即可

        // --- Controls, UppercaseVisualizer, SplitVisualizer, HexVisualizer,
        //     FindVisualizer, ReverseSwapVisualizer, IsbnVisualizer ---
        // （这些子组件也全部保持你现在文件里的版本不动，直接原样复制即可）
        // ............................

        // --- 主 Visualizer 组件 (分发器) ---
        const Visualizer = ({ type }) => {
            switch (type) {
                case "UPPERCASE_DEMO": return <UppercaseVisualizer />;
                case "SPLIT_DEMO": return <SplitVisualizer />;
                case "HEX_DEMO": return <HexVisualizer />;
                case "FIND_DEMO": return <FindVisualizer />;
                case "REVERSE_SWAP_DEMO": return <ReverseSwapVisualizer />;
                case "ISBN_DEMO": return <IsbnVisualizer />;
                default: return <div className="text-gray-400">模块加载错误</div>;
            }
        };

        // --- 主应用组件 ---
        const App = () => {
            const [activeSectionId, setActiveSectionId] = useState(sectionsData[0].id);
            const [activeProblemId, setActiveProblemId] = useState(sectionsData[0].problems[0].id);
            const [activeTab, setActiveTab] = useState('logic');

            const currentSection =
                sectionsData.find(s => s.id === activeSectionId) || sectionsData[0];
            const activeProblem =
                sectionsData.flatMap(s => s.problems)
                            .find(p => p.id === activeProblemId)
                || sectionsData[0].problems[0];
            const isTheory = currentSection.isTheory;

            // 关键1：判断是否嵌在 iframe 中
            const isEmbedded = window.self !== window.top;

            // 原来的“防 F12”等安全保护逻辑
            useEffect(() => {
                const handleContextMenu = (e) => { e.preventDefault(); return false; };
                const handleKeyDown = (e) => {
                    if (
                        e.key === 'F12' ||
                        (e.ctrlKey && e.shiftKey && ['I','C','J'].includes(e.key)) ||
                        (e.ctrlKey && e.key === 'u')
                    ) {
                        e.preventDefault();
                        e.stopPropagation();
                        return false;
                    }
                };
                document.addEventListener('contextmenu', handleContextMenu);
                document.addEventListener('keydown', handleKeyDown);
                return () => {
                    document.removeEventListener('contextmenu', handleContextMenu);
                    document.removeEventListener('keydown', handleKeyDown);
                };
            }, []);

            // 关键2：如果在 iframe 中，把自己的高度发给父页面
            useEffect(() => {
                if (!isEmbedded) return;

                const reportSize = () => {
                    const height = document.documentElement.scrollHeight;
                    if (window.parent && window.parent !== window) {
                        window.parent.postMessage(
                            { type: "gesp-widget-resize", height },
                            "*"
                        );
                    }
                };

                reportSize();
                const ro = new ResizeObserver(reportSize);
                ro.observe(document.body);

                return () => ro.disconnect();
            }, [isEmbedded]);

            return (
                <div
                    className={
                        (isEmbedded ? "min-h-0" : "min-h-screen") +
                        " flex flex-col md:flex-row select-none"
                    }
                >
                    {/* 左侧导航栏 */}
                    <div className="w-full md:w-72 bg-white border-r border-gray-200 p-4 flex-shrink-0 flex flex-col h-auto md:h-screen sticky top-0 overflow-y-auto justify-between">
                        <div>
                            {/* 在独立访问时显示大标题；在 iframe 中隐藏它，避免和外层重复 */}
                            {!isEmbedded && (
                                <div className="mb-6">
                                    <h1 className="text-xl font-extrabold text-orange-600 flex items-center gap-2">
                                        <Layers className="text-orange-500" /> 童澄 GESP 专题
                                    </h1>
                                    <p className="text-xs text-gray-400 mt-1 pl-8">
                                        Level 4 - 字符串深度解析
                                    </p>
                                </div>
                            )}

                            {/* iframe 模式下给个小标题“课程目录” */}
                            {isEmbedded && (
                                <div className="mb-3 text-xs text-gray-400 uppercase tracking-wider pl-1">
                                    课程目录
                                </div>
                            )}

                            <div className="space-y-6">
                                {sectionsData.map(section => (
                                    <div key={section.id}>
                                        <div
                                            className={
                                                "flex items-center gap-2 mb-3 px-2 py-1 rounded-lg cursor-pointer transition-colors " +
                                                (activeSectionId === section.id
                                                    ? "bg-orange-50 text-orange-700"
                                                    : "text-gray-500 hover:bg-gray-50")
                                            }
                                            onClick={() => {
                                                setActiveSectionId(section.id);
                                                setActiveProblemId(section.problems[0].id);
                                                setActiveTab('logic');
                                            }}
                                        >
                                            <BookOpen size={16} />
                                            <span className="font-bold text-sm">
                                                {section.name}
                                            </span>
                                        </div>

                                        {activeSectionId === section.id && (
                                            <div className="space-y-3 pl-2 border-l-2 border-orange-100 ml-2">
                                                {section.problems.map(problem => (
                                                    <div
                                                        key={problem.id}
                                                        onClick={() =>
                                                            setActiveProblemId(problem.id)
                                                        }
                                                        className={
                                                            "cursor-pointer p-3 rounded-lg border text-sm transition-all " +
                                                            (activeProblem.id === problem.id
                                                                ? "border-orange-400 bg-orange-50 text-orange-800"
                                                                : "border-gray-100 hover:border-orange-200")
                                                        }
                                                    >
                                                        <div className="font-bold flex items-center gap-2">
                                                            <span className="text-xs bg-white border px-1 rounded text-gray-400">
                                                                {problem.id.split('-')[1]}
                                                            </span>
                                                            {problem.title}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>
                                ))}
                            </div>
                        </div>

                        {/* 底部版权：在 iframe 中也可以留着，当作小水印 */}
                        <div className="text-xs text-gray-300 mt-8 text-center border-t pt-4">
                            © 2025 童澄未来 (Tongcheng Future). <br/>All Rights Reserved.
                        </div>
                    </div>

                    {/* 右侧主内容 */}
                    <div className="flex-1 p-4 md:p-8 bg-orange-50/30 overflow-y-auto">
                        <div className="max-w-4xl mx-auto">
                            {/* 标题区 */}
                            <header className="mb-8">
                                <div className="flex items-center gap-2 text-sm text-orange-600 font-medium mb-2">
                                    <span className="bg-orange-100 px-2 py-0.5 rounded text-xs">
                                        {activeProblem.id}
                                    </span>
                                    <ChevronRight size={14} />
                                    <span>{activeProblem.tags.join(" / ")}</span>
                                </div>
                                <h2 className="text-3xl font-bold text-gray-900 mb-4">
                                    {activeProblem.title}
                                </h2>
                                <p className="text-gray-600 bg-white p-5 rounded-xl border border-gray-200 shadow-sm text-sm md:text-base leading-relaxed">
                                    {activeProblem.desc}
                                </p>
                            </header>

                            {/* 理论 or 习题 */}
                            {isTheory ? (
                                <div className="space-y-8 animate-fade-in-up">
                                    {activeProblem.content.map((block, idx) => (
                                        <div
                                            key={idx}
                                            className="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden"
                                        >
                                            <div className="bg-orange-50 px-6 py-3 border-b border-orange-100 font-bold text-orange-800">
                                                {block.title}
                                            </div>
                                            <div className="p-6">
                                                {block.type === 'table' && (
                                                    <table className="w-full text-sm text-left">
                                                        <thead className="bg-gray-50 text-gray-600">
                                                            <tr>
                                                                {block.headers.map(h => (
                                                                    <th key={h} className="px-4 py-2">
                                                                        {h}
                                                                    </th>
                                                                ))}
                                                            </tr>
                                                        </thead>
                                                        <tbody className="divide-y divide-gray-100">
                                                            {block.rows.map((r, ri) => (
                                                                <tr key={ri}>
                                                                    {r.map((c, ci) => (
                                                                        <td
                                                                            key={ci}
                                                                            className={
                                                                                "px-4 py-3 " +
                                                                                (ci === 1
                                                                                    ? "font-mono text-blue-600"
                                                                                    : "")
                                                                            }
                                                                        >
                                                                            {c}
                                                                        </td>
                                                                    ))}
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                )}
                                                {block.type === 'code' && (
                                                    <div className="relative">
                                                        <div className="mb-2 text-gray-500 text-sm">
                                                            {block.desc}
                                                        </div>
                                                        <pre className="bg-gray-900 text-gray-100 p-4 rounded-lg text-sm font-mono overflow-x-auto">
                                                            <code>{block.code}</code>
                                                        </pre>
                                                    </div>
                                                )}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            ) : (
                                <>
                                    {/* Tab 切换 */}
                                    <div className="flex items-center gap-4 mb-6 border-b border-gray-200">
                                        <button
                                            onClick={() => setActiveTab('logic')}
                                            className={
                                                "pb-3 px-2 text-sm font-bold flex items-center gap-2 border-b-2 transition-colors " +
                                                (activeTab === 'logic'
                                                    ? "border-orange-500 text-orange-600"
                                                    : "border-transparent text-gray-400 hover:text-gray-600")
                                            }
                                        >
                                            <Lightbulb size={18}/> 解题思路 & 演示
                                        </button>
                                        <button
                                            onClick={() => setActiveTab('code')}
                                            className={
                                                "pb-3 px-2 text-sm font-bold flex items-center gap-2 border-b-2 transition-colors " +
                                                (activeTab === 'code'
                                                    ? "border-orange-500 text-orange-600"
                                                    : "border-transparent text-gray-400 hover:text-gray-600")
                                            }
                                        >
                                            <Code size={18}/> 满分代码
                                        </button>
                                    </div>

                                    <div className="min-h-[400px]">
                                        {activeTab === 'logic' && (
                                            <div className="space-y-6 animate-fade-in-up">
                                                {activeProblem.pseudo && (
                                                    <div className="bg-gray-800 text-gray-200 p-4 rounded-xl border border-gray-700 shadow-sm mb-6 font-mono text-sm whitespace-pre-wrap leading-relaxed relative">
                                                        <div className="absolute top-2 right-2 text-xs text-gray-500 font-bold uppercase tracking-wider flex items-center gap-1">
                                                            <Terminal size={12} /> Pseudo-code
                                                        </div>
                                                        {activeProblem.pseudo}
                                                    </div>
                                                )}

                                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                                    {activeProblem.logic.map((step, idx) => (
                                                        <div key={idx} className="bg-white p-4 rounded-xl border border-gray-100 shadow-sm flex gap-3">
                                                            <div className="flex-shrink-0 w-6 h-6 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-bold text-sm">
                                                                {idx + 1}
                                                            </div>
                                                            <div>
                                                                <h4 className="font-bold text-gray-800 text-sm mb-1">
                                                                    {step.title}
                                                                </h4>
                                                                <p className="text-gray-600 text-xs leading-relaxed">
                                                                    {step.text}
                                                                </p>
                                                            </div>
                                                        </div>
                                                    ))}
                                                </div>

                                                {activeProblem.visualType && (
                                                    <Visualizer type={activeProblem.visualType} />
                                                )}
                                            </div>
                                        )}

                                        {activeTab === 'code' && (
                                            <div className="relative group animate-fade-in-up">
                                                <div className="absolute top-0 right-0 p-2">
                                                    <span className="text-xs font-mono text-gray-400 bg-gray-800 px-2 py-1 rounded border border-gray-700">
                                                        C++14
                                                    </span>
                                                </div>
                                                <pre className="bg-gray-900 text-gray-100 p-6 rounded-xl overflow-x-auto text-sm font-mono leading-relaxed shadow-inner border border-gray-800">
                                                    <code>{activeProblem.code}</code>
                                                </pre>
                                                <div className="mt-4 flex items-start gap-2 text-sm text-green-600 bg-green-50 p-3 rounded-lg border border-green-100">
                                                    <CheckCircle size={16} className="mt-0.5 flex-shrink-0" />
                                                    <span>
                                                        代码提示：代码中使用了标准 namespace，如果是 GESP 考试，请务必包含
                                                        <code className="mx-1">using namespace std;</code>
                                                        并使用 <code className="mx-1">iostream</code> 头文件。
                                                    </span>
                                                </div>
                                            </div>
                                        )}
                                    </div>
                                </>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
