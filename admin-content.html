<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>童澄 CMS - 内容管理</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #f8fafc; }
        textarea { font-family: 'Consolas', 'Monaco', monospace; line-height: 1.6; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="bg-white border-b border-gray-200 px-6 h-16 flex justify-between items-center shadow-sm shrink-0 z-50">
        <div class="flex items-center gap-8">
            <div class="font-bold text-gray-800 text-lg flex items-center gap-2">
                <img src="assets/logo.png" class="w-7 h-7 rounded object-cover">
                童澄后台
            </div>
            
            <nav class="flex bg-gray-100 p-1 rounded-lg">
                <a href="admin-content.html" class="px-4 py-1.5 rounded-md text-sm font-bold bg-white text-orange-600 shadow-sm transition">
                    📚 内容管理
                </a>
                <a href="admin-problems.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                    ✍️ 题库录入
                </a>
                <a href="admin-orders.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                    💰 订单审核
                </a>
                <a href="admin-users.html" class="px-4 py-1.5 rounded-md text-sm font-medium text-gray-500 hover:text-gray-900 transition">
                    👥 人员权限
                </a>
            </nav>
        </div>

        <div class="flex items-center gap-4 text-sm">
            <span class="text-xs bg-orange-100 text-orange-600 px-2 py-1 rounded font-bold">管理员模式</span>
            <a href="index.html" class="text-gray-400 hover:text-gray-600 transition">退出后台</a>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <aside class="w-72 bg-white border-r border-gray-200 flex flex-col">
            <div class="p-4 border-b flex justify-between items-center bg-gray-50">
                <span class="font-bold text-sm text-gray-700">课程列表</span>
                <button onclick="window.createNewTopic()" class="text-xs bg-orange-500 text-white px-3 py-1.5 rounded hover:bg-orange-600 transition shadow-sm">+ 新建课程</button>
            </div>
            <div id="topic-list" class="flex-1 overflow-y-auto p-2 space-y-1"></div>
        </aside>

        <main class="flex-1 flex flex-col bg-white relative min-w-0">
            <div id="editor-area" class="flex-1 flex flex-col hidden h-full">
                <div class="p-6 border-b border-gray-100 grid grid-cols-12 gap-6 bg-gray-50 items-end">
                    <div class="col-span-4">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5">课程标题</label>
                        <input id="edit-name" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm font-bold focus:ring-2 focus:ring-orange-500 outline-none transition">
                    </div>
                    <div class="col-span-3">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5">分类 (如: 核心算法)</label>
                        <input id="edit-category" type="text" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition">
                    </div>
                    <div class="col-span-2">
                        <label class="block text-xs font-bold text-gray-500 mb-1.5">排序 (数字越小越靠前)</label>
                        <input id="edit-order" type="number" class="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm focus:ring-2 focus:ring-orange-500 outline-none transition">
                    </div>
                    
                    <div class="col-span-3 flex items-center h-10">
                        <label class="inline-flex items-center cursor-pointer select-none">
                            <input type="checkbox" id="edit-free" class="sr-only peer">
                            <div class="relative w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full rtl:peer-checked:after:-translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:start-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-green-500"></div>
                            <span class="ms-3 text-sm font-medium text-gray-600">免费试听</span>
                        </label>
                    </div>
                </div>
                
                <div class="flex-1 p-6 flex flex-col h-full overflow-hidden">
                    <label class="block text-xs font-bold text-gray-400 mb-2 uppercase">Markdown 内容编辑</label>
                    <textarea id="edit-content" class="flex-1 w-full border border-gray-200 rounded-lg p-5 text-sm focus:outline-none focus:border-orange-500 resize-none placeholder-gray-300 leading-relaxed font-mono shadow-inner" placeholder="# 这里写标题&#10;&#10;这里写正文内容...&#10;&#10;嵌入演示: <iframe src='/widgets/bfs.html'></iframe>"></textarea>
                </div>

                <div class="p-4 border-t border-gray-100 flex justify-end gap-4 bg-gray-50 items-center">
                    <span id="save-status" class="text-sm font-bold text-green-600 hidden bg-green-100 px-3 py-1 rounded-full">✅ 已保存</span>
                    <button onclick="window.saveCurrentTopic()" class="bg-orange-500 text-white px-8 py-2.5 rounded-lg font-bold hover:bg-orange-600 shadow-md hover:shadow-lg transition transform active:scale-95">保存更改</button>
                </div>
            </div>
            
            <div id="empty-state" class="flex-1 flex flex-col items-center justify-center text-gray-400 bg-gray-50/50">
                <div class="text-6xl mb-4">👈</div>
                <p class="font-medium">请在左侧选择课程进行编辑</p>
                <button onclick="window.createNewTopic()" class="mt-4 text-orange-500 hover:underline text-sm">或点击此处新建</button>
            </div>
        </main>
    </div>

    <script type="module">
        import supabase from './client.js';

        let currentId = null;
        let allTopics = [];

        (async () => {
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) return location.href = 'login.html';
            const { data: profile } = await supabase.from('profiles').select('role').single();
            const role = profile?.role;

            // 1. 权限检查：允许 admin 和 teacher
            if (role !== 'admin' && role !== 'teacher') {
                alert('权限不足：仅限管理员或教研老师访问');
                return location.href = 'index.html';
            }

            // 2. 动态调整导航栏 (如果是 teacher，隐藏敏感链接)
            if (role === 'teacher') {
                // 隐藏 订单审核、人员权限
                // 注意：请确保您 HTML 里的导航链接有对应的 ID 或包含特定文字，或者直接用下面的通用隐藏法
                const navLinks = document.querySelectorAll('nav a');
                navLinks.forEach(link => {
                    if (link.href.includes('admin-orders') || link.href.includes('admin-users')) {
                        link.style.display = 'none';
                    }
                });
                // 修改右上角标签
                document.querySelector('.bg-orange-100').textContent = '教研老师模式';
            }

            loadTopics();
        })();

        async function loadTopics() {
            const { data, error } = await supabase.from('topics').select('*').order('category').order('order_no');
            if (error) return alert('加载失败');
            allTopics = data;
            renderList();
        }

        function renderList() {
            const el = document.getElementById('topic-list');
            el.innerHTML = '';
            const sorted = allTopics.sort((a,b) => (a.category||'').localeCompare(b.category||'') || a.order_no - b.order_no);

            sorted.forEach(t => {
                const item = document.createElement('div');
                item.className = 'px-4 py-3 border-b border-gray-100 hover:bg-orange-50 cursor-pointer text-sm flex justify-between items-center group transition';
                if(t.id === currentId) item.classList.add('bg-orange-100', 'text-orange-800', 'font-bold', 'border-orange-200');
                
                const freeBadge = t.is_free ? '<span class="text-[10px] bg-green-100 text-green-700 px-1.5 py-0.5 rounded mr-2 border border-green-200">免</span>' : '';

                item.innerHTML = `
                    <div class="truncate w-36 flex items-center">${freeBadge}${t.name}</div>
                    <div class="text-xs text-gray-400 group-hover:text-orange-400">${t.category}</div>
                `;
                item.onclick = () => window.selectTopic(t);
                el.appendChild(item);
            });
        }

        window.selectTopic = (t) => {
            currentId = t.id;
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('editor-area').classList.remove('hidden');

            document.getElementById('edit-name').value = t.name;
            document.getElementById('edit-category').value = t.category;
            document.getElementById('edit-order').value = t.order_no || 99;
            document.getElementById('edit-content').value = t.content || '';
            document.getElementById('edit-free').checked = !!t.is_free;
            
            renderList();
        }

        window.createNewTopic = async () => {
            const name = prompt("请输入新课程名称:");
            if (!name) return;
            const { data, error } = await supabase.from('topics').insert([{ name: name, category: '未分类', order_no: 999 }]).select();
            if (error) return alert(error.message);
            await loadTopics();
            window.selectTopic(data[0]);
        }

        window.saveCurrentTopic = async () => {
            if (!currentId) return;
            const btn = document.querySelector('button[onclick="window.saveCurrentTopic()"]');
            const originalText = btn.textContent;
            btn.textContent = '保存中...'; btn.disabled = true;

            const updates = {
                name: document.getElementById('edit-name').value,
                category: document.getElementById('edit-category').value,
                order_no: parseInt(document.getElementById('edit-order').value),
                content: document.getElementById('edit-content').value,
                is_free: document.getElementById('edit-free').checked
            };

            const { error } = await supabase.from('topics').update(updates).eq('id', currentId);
            
            btn.disabled = false; btn.textContent = originalText;

            if (error) alert(error.message);
            else {
                const status = document.getElementById('save-status');
                status.classList.remove('hidden');
                setTimeout(() => status.classList.add('hidden'), 2000);
                loadTopics(); 
            }
        }
    </script>
</body>
</html>
