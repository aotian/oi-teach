<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>升级 / 续费 - 童澄未来</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{ --brand:#f97316; --line:#ffe4cc; --bg:#fff7ed; --ink:#1f2937; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,Arial,sans-serif;color:var(--ink)}
    .wrap{max-width:1080px;margin:24px auto;padding:0 16px}
    h1{font-size:28px;margin:0 0 12px 0}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
    .priceA{display:flex;gap:24px;flex-wrap:wrap;align-items:baseline;margin:10px 0 18px 0}
    .priceA .item{
      font-size:24px;font-weight:800;color:#9a3412;letter-spacing:.3px;
      background:#fff1e6;border:1px solid #ffb380;border-radius:12px;padding:8px 14px;
      box-shadow:0 1px 0 rgba(0,0,0,.03) inset;
    }
    .muted{color:#64748b;font-size:13px}
    .btn{display:inline-block;background:var(--brand);color:#fff;border-radius:10px;padding:10px 14px;text-decoration:none}
    .qrs{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-items:start}
    .qr img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);background:#fff}
    .links{margin-top:6px}
    .links a{font-size:12px;color:#2563eb;margin-right:10px}
    .hint{margin-top:8px;font-size:12px;color:#6b7280}
    @media (max-width:860px){ .grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>升级 / 续费</h1>
    <div class="grid">
      <div class="card">
        <h3>会员价格</h3>
        <div class="priceA">
          <div class="item">月度 ¥29</div>
          <div class="item">季度 ¥79</div>
          <div class="item">年度 ¥299</div>
        </div>
        <p class="muted">支付后 <b>10 分钟内</b> 开通。若未开通，请在右侧通过微信添加客服并发送你的注册邮箱。</p>
        <a class="btn" href="index.html">返回首页</a>
      </div>
      <!-- 订单提交流程（选择套餐 + 上传支付截图 + 备注 + 提交） -->
      <div class="card" style="margin-top:14px; border:1px dashed #fde68a; background:#fffbeb;">
  <h4 style="margin:0 0 8px 0;">提交支付截图，进入人工审核</h4>

  <!-- 1) 选择套餐 -->
  <div style="margin:8px 0 10px 0;">
    <div style="font-size:13px; color:#64748b; margin-bottom:6px;">请选择你支付的套餐</div>
    <label style="margin-right:10px;">
      <input type="radio" name="plan" value="monthly" checked>
      月度（¥29）
    </label>
    <label style="margin-right:10px;">
      <input type="radio" name="plan" value="quarterly">
      季度（¥79）
    </label>
    <label>
      <input type="radio" name="plan" value="yearly">
      年度（¥299）
    </label>
  </div>

  <!-- 2) 上传截图 -->
  <div style="margin:10px 0;">
    <div style="font-size:13px; color:#64748b; margin-bottom:6px;">上传支付成功页面截图（jpg/png）</div>
    <input id="pay-file" type="file" accept="image/*">
    <div id="pay-preview" style="margin-top:8px;"></div>
  </div>

  <!-- 3) 备注 -->
  <div style="margin:10px 0;">
    <div style="font-size:13px; color:#64748b; margin-bottom:6px;">备注（可选，如订单号/学校/班级等）</div>
    <input id="pay-memo" type="text" placeholder="示例：张三 一(3)班" style="width:100%; padding:10px; border:1px solid #eee; border-radius:8px;">
  </div>

  <!-- 4) 提交按钮 & 提示 -->
  <button id="pay-submit" class="btn" style="background:#f97316;">提交审核</button>
  <span id="pay-tip" style="margin-left:8px; font-size:13px; color:#64748b;"></span>
</div>

<script type="module">
  import supabase from './client.js';

  const $ = (id)=>document.getElementById(id);
  const tip = (t,color='#64748b')=>{
    const el = $('pay-tip'); el.textContent = t; el.style.color = color;
  }

  // 预览图片
  const fileInput = $('pay-file');
  fileInput.addEventListener('change', ()=>{
    const box = $('pay-preview'); box.innerHTML = '';
    const f = fileInput.files?.[0];
    if (!f) return;
    const img = document.createElement('img');
    img.src = URL.createObjectURL(f);
    img.style.maxWidth = '160px';
    img.style.border = '1px solid #eee';
    img.style.borderRadius = '8px';
    img.style.padding = '4px';
    box.appendChild(img);
  });

  // 获取当前套餐与价格
  function getPlanAndPrice(){
    const v = [...document.querySelectorAll('input[name="plan"]')]
      .find(r=>r.checked)?.value || 'monthly';
    const price = v==='monthly' ? 29 : v==='quarterly' ? 79 : 299;
    return { plan:v, price };
  }

  // 提交订单
  $('pay-submit').addEventListener('click', async ()=>{
    tip('');
    // 登录校验
    const { data:auth } = await supabase.auth.getUser();
    const user = auth?.user;
    if (!user) {
      location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname);
      return;
    }

    const f = fileInput.files?.[0];
    if (!f) { tip('请先选择支付截图再提交。', '#dc2626'); return; }

    const { plan, price } = getPlanAndPrice();
    const memo = $('pay-memo').value?.trim() || `plan=${plan}, price=¥${price}`;

    // 1) 上传到 Storage: payproof bucket 下的 user_id/ 时间戳_随机名
    tip('正在上传截图…');
    const bucket = 'payproof'; // 你控制台里创建的 public bucket 名称
    const filename = `${Date.now()}_${Math.random().toString(16).slice(2)}.${(f.name.split('.').pop()||'jpg')}`;
    const path = `${user.id}/${filename}`;

    const { error:uploadErr } = await supabase.storage.from(bucket).upload(path, f, {
      cacheControl: '3600',
      upsert: false,
      contentType: f.type || 'image/jpeg'
    });
    if (uploadErr){ tip('上传失败：'+uploadErr.message, '#dc2626'); return; }

    // 2) 获取公开 URL（若 bucket 是 public）
    const { data:pub } = supabase.storage.from(bucket).getPublicUrl(path);
    const imageUrl = pub?.publicUrl || null;

    // 3) 写入 orders 表（status=pending）
    tip('正在创建订单…');
    const { error:insErr } = await supabase.from('orders').insert([{
      user_id: user.id,
      email: user.email,
      image_url: imageUrl,
      memo,
      status: 'pending'
    }]);
    if (insErr){ tip('创建订单失败：'+insErr.message, '#dc2626'); return; }

    tip('已提交，10 分钟内完成人工审核。', '#16a34a');
    fileInput.value = '';
    $('pay-preview').innerHTML = '';
    $('pay-memo').value = '';
  });
</script>

      <div class="card">
        <h3>扫码支付 / 联系客服</h3>
        <div class="qrs">
          <div class="qr">
            <div class="muted" style="margin-bottom:6px">支付宝</div>
            <img id="qr-alipay" src="alipay_qr.jpg" alt="支付宝二维码">
            <div class="links">
              <a href="alipay_qr.jpg" target="_blank">新窗口打开</a>
              <a href="alipay_qr.jpg" download>下载图片</a>
            </div>
          </div>

          <div class="qr" id="wechat-block">
            <div class="muted" style="margin-bottom:6px">微信客服</div>
            <img id="qr-wechat" src="客服.jpg" alt="微信客服二维码">
            <div class="links">
              <a id="wechat-open" href="客服.jpg" target="_blank">新窗口打开</a>
              <a id="wechat-dl" href="客服.jpg" download>下载图片</a>
            </div>
            <!-- <div class="hint">若图片未显示，已自动隐藏；你也可以把同一张图命名为 <code>wechat_service.jpg</code> 放在站点根目录。</div> -->
          </div>
        </div>

        <!-- <p class="muted" style="margin-top:10px">请务必发送你的 <b>注册邮箱</b> 给客服，以便人工审核开通。</p> -->
      </div>
    </div>
  </div>

  <script>
    // 微信二维码：若两种文件名都加载失败，则自动隐藏整块
    const wechatImg = document.getElementById('qr-wechat');
    const wechatBlock = document.getElementById('wechat-block');
    const openA = document.getElementById('wechat-open');
    const dlA = document.getElementById('wechat-dl');
    if (wechatImg) {
      wechatImg.onerror = function(){
        if (!this.dataset.fallbackTried) {
          this.dataset.fallbackTried = '1';
          this.src = 'wechat_service.jpg';
          openA && (openA.href = 'wechat_service.jpg');
          dlA && (dlA.href = 'wechat_service.jpg');
        } else {
          wechatBlock && (wechatBlock.style.display = 'none');
        }
      };
    }
  </script>
</body>
</html>
