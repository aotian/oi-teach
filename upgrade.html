<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>升级 / 续费 - 童澄未来</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#FA7800', light: '#fffbf0', hover: '#c2410c' }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    </style>
</head>
<body class="bg-gray-50 text-gray-700">

    <nav class="h-16 bg-white border-b border-orange-100 flex items-center justify-between px-6 shadow-sm">
        <div class="flex items-center gap-2">
            <img src="assets/logo.png" alt="Logo" class="w-8 h-8 rounded-lg shadow-sm object-cover">
            <span class="text-xl font-bold text-gray-800">会员中心</span>
        </div>
        <div class="flex gap-4 text-sm font-medium">
            <a href="index.html" class="hover:text-brand transition">返回首页</a>
            <a href="account.html" class="hover:text-brand transition">我的账户</a>
        </div>
    </nav>

    <div class="max-w-5xl mx-auto py-10 px-4 grid md:grid-cols-2 gap-8">
        
        <div class="space-y-6">
            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                <h2 class="text-2xl font-bold text-gray-800 mb-6">解锁全部课程</h2>
                <div class="flex flex-wrap gap-4 mb-8">
                    <div class="px-4 py-2 bg-orange-50 border border-brand text-brand font-bold rounded-lg text-lg shadow-sm">
                        月度 ¥29
                    </div>
                    <div class="px-4 py-2 bg-orange-50 border border-brand text-brand font-bold rounded-lg text-lg shadow-sm">
                        季度 ¥79
                    </div>
                    <div class="px-4 py-2 bg-brand text-white font-bold rounded-lg text-lg shadow-lg shadow-orange-200 transform scale-105">
                        年度 ¥299
                    </div>
                </div>
                <div class="text-sm text-gray-500 space-y-2 leading-relaxed">
                    <p>🚀 <b>权益包括：</b>所有知识点讲义、交互式课件、在线判题系统。</p>
                    <p>⏱️ <b>开通时效：</b>支付后提交截图，人工审核通常在 10-30 分钟内完成。</p>
                </div>
            </div>

            <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-8">
                <h3 class="font-bold text-gray-800 mb-4 border-l-4 border-brand pl-3">扫码支付</h3>
                <div class="grid grid-cols-2 gap-6">
                    <div class="text-center">
                        <div class="bg-gray-50 p-2 rounded-lg border border-gray-200 mb-2">
                            <img src="assets/alipay_qr.jpg" alt="支付宝" class="w-full rounded-md">
                        </div>
                        <span class="text-xs text-gray-500">支付宝扫码</span>
                    </div>
                    <div class="text-center">
                        <div class="bg-gray-50 p-2 rounded-lg border border-gray-200 mb-2">
                            <img src="assets/客服.jpg" alt="客服微信" class="w-full rounded-md">
                        </div>
                        <span class="text-xs text-gray-500">添加客服微信</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-2xl shadow-lg border border-orange-100 p-8 h-fit relative overflow-hidden">
            <div class="absolute top-0 left-0 w-full h-1 bg-brand"></div>
            
            <h3 class="text-xl font-bold text-gray-800 mb-6">提交支付凭证</h3>
            
            <div class="space-y-6">
                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2">您支付的套餐</label>
                    <div class="flex gap-4" id="plan-options">
                        <label class="cursor-pointer flex items-center gap-2">
                            <input type="radio" name="plan" value="monthly" checked class="text-brand focus:ring-brand">
                            <span class="text-sm">月度</span>
                        </label>
                        <label class="cursor-pointer flex items-center gap-2">
                            <input type="radio" name="plan" value="quarterly" class="text-brand focus:ring-brand">
                            <span class="text-sm">季度</span>
                        </label>
                        <label class="cursor-pointer flex items-center gap-2">
                            <input type="radio" name="plan" value="yearly" class="text-brand focus:ring-brand">
                            <span class="text-sm font-bold text-brand">年度</span>
                        </label>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2">上传截图 (必填)</label>
                    <div class="border-2 border-dashed border-gray-300 rounded-xl p-6 text-center hover:border-brand hover:bg-orange-50 transition cursor-pointer relative">
                        <input id="pay-file" type="file" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer">
                        <div id="upload-placeholder">
                            <p class="text-2xl mb-1">📷</p>
                            <span class="text-sm text-gray-400">点击选择图片</span>
                        </div>
                        <div id="pay-preview" class="hidden"></div>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-bold text-gray-600 mb-2">备注信息</label>
                    <input id="pay-memo" type="text" placeholder="例如：张三 (家长代付)" 
                        class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand text-sm">
                </div>

                <button id="pay-submit" class="w-full py-3 bg-brand text-white font-bold rounded-xl hover:bg-brand-hover shadow-md transition disabled:opacity-50">
                    提交审核
                </button>
                
                <div id="pay-tip" class="text-center text-xs text-gray-400 min-h-[1rem]"></div>
            </div>
        </div>
    </div>

    <script type="module">
        import supabase from './client.js';

        const fileInput = document.getElementById('pay-file');
        const previewBox = document.getElementById('pay-preview');
        const placeholder = document.getElementById('upload-placeholder');
        const tipEl = document.getElementById('pay-tip');

        // 预览图片
        fileInput.addEventListener('change', () => {
            const f = fileInput.files?.[0];
            if (!f) return;
            const img = document.createElement('img');
            img.src = URL.createObjectURL(f);
            img.className = 'h-32 mx-auto rounded shadow-sm border border-gray-200 object-contain';
            previewBox.innerHTML = '';
            previewBox.appendChild(img);
            previewBox.classList.remove('hidden');
            placeholder.classList.add('hidden');
        });

        // 计算哈希 (去重关键)
        async function sha256File(file){
            const buf = await file.arrayBuffer();
            const hashBuf = await crypto.subtle.digest('SHA-256', buf);
            const hashArr = Array.from(new Uint8Array(hashBuf));
            return hashArr.map(b=>b.toString(16).padStart(2,'0')).join('');
        }

        // 提交逻辑
        document.getElementById('pay-submit').addEventListener('click', async () => {
            const btn = document.getElementById('pay-submit');
            
            // 1. 检查登录
            const { data: { user } } = await supabase.auth.getUser();
            if (!user) {
                window.location.href = 'login.html?redirect=upgrade.html';
                return;
            }

            // 2. 校验文件
            const f = fileInput.files?.[0];
            if (!f) {
                tipEl.textContent = '请先上传截图';
                tipEl.className = 'text-center text-xs text-red-500 font-bold';
                return;
            }

            btn.disabled = true;
            btn.textContent = '正在处理...';
            tipEl.textContent = '';

            try {
                // 3. 查重
                const hash = await sha256File(f);
                const { data: dup } = await supabase.from('orders').select('id').eq('image_hash', hash).limit(1);
                if (dup && dup.length) throw new Error('请勿重复提交相同的截图');

                // 4. 上传到 Storage
                const ext = f.name.split('.').pop();
                const path = `${user.id}/${Date.now()}_${Math.random().toString(36).slice(2)}.${ext}`;
                const { error: upErr } = await supabase.storage.from('payproof').upload(path, f);
                if (upErr) throw upErr;

                // 5. 获取公开链接
                const { data: { publicUrl } } = supabase.storage.from('payproof').getPublicUrl(path);

                // 6. 写入数据库
                const plan = document.querySelector('input[name="plan"]:checked').value;
                const memoText = document.getElementById('pay-memo').value;
                const fullMemo = `plan=${plan}, ${memoText}`; // 组合备注

                const { error: insErr } = await supabase.from('orders').insert([{
                    user_id: user.id,
                    email: user.email,
                    image_url: publicUrl,
                    image_hash: hash,
                    memo: fullMemo,
                    status: 'pending'
                }]);
                
                if (insErr) throw insErr;

                // 成功
                alert('提交成功！请等待管理员审核。');
                window.location.href = 'account.html';

            } catch (err) {
                tipEl.textContent = err.message;
                tipEl.className = 'text-center text-xs text-red-500 font-bold';
                btn.disabled = false;
                btn.textContent = '提交审核';
            }
        });
    </script>
</body>
</html>
