<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 / 注册 - 童澄未来</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: { DEFAULT: '#FA7800', hover: '#c2410c', light: '#fff7ed' }
                    }
                }
            }
        }
    </script>
    <style>
        body { background: linear-gradient(135deg, #fff7ed 0%, #fff 100%); }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md p-8 rounded-2xl shadow-xl border border-orange-100">
        
        <div class="flex justify-center mb-8">
            <div class="flex items-center gap-2">
                <img src="assets/logo.png" alt="Logo" class="w-10 h-10 rounded-lg shadow-lg shadow-orange-200 object-cover">
                <span class="text-2xl font-bold text-gray-800 tracking-tight">童澄未来</span>
            </div>
        </div>

        <div class="flex justify-center gap-8 mb-8 border-b border-gray-100 pb-2">
            <button onclick="toggleMode('login')" id="tab-login" class="pb-2 border-b-2 border-brand text-brand font-bold transition">
                登录账号
            </button>
            <button onclick="toggleMode('register')" id="tab-register" class="pb-2 border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition">
                注册新用户
            </button>
        </div>

        <form id="auth-form" class="space-y-5">
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">电子邮箱</label>
                <input type="text" id="email" required placeholder="name@example.com"
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition">
            </div>

            <div>
                <label class="block text-sm font-bold text-gray-700 mb-1">密码</label>
                <input type="password" id="password" required placeholder="请输入6位以上密码" 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition">
            </div>

            <div id="confirm-box" class="hidden fade-in">
                <label class="block text-sm font-bold text-gray-700 mb-1">确认密码</label>
                <input type="password" id="confirm-password" placeholder="请再次输入密码" 
                    class="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:outline-none focus:border-brand focus:ring-1 focus:ring-brand transition">
            </div>

            <div id="error-msg" class="text-red-500 text-sm text-center hidden bg-red-50 p-2 rounded-lg"></div>
            <div id="success-msg" class="text-green-600 text-sm text-center hidden bg-green-50 p-2 rounded-lg"></div>

            <button type="submit" id="btn-submit" 
                class="w-full py-3 bg-brand text-white font-bold rounded-xl hover:bg-brand-hover shadow-lg shadow-orange-200 transition transform hover:-translate-y-0.5">
                立即登录
            </button>
        </form>

        <p class="text-center text-xs text-gray-400 mt-6">
            登录即代表您同意 <a href="#" class="underline hover:text-brand">用户协议</a> 和 <a href="#" class="underline hover:text-brand">隐私政策</a>
        </p>
    </div>

    <script type="module">
        import supabase from './client.js';

        let isLogin = true;

        window.toggleMode = (mode) => {
            isLogin = (mode === 'login');
            const tLogin = document.getElementById('tab-login');
            const tReg = document.getElementById('tab-register');
            const cBox = document.getElementById('confirm-box');
            const btn = document.getElementById('btn-submit');
            const msg = document.getElementById('error-msg');
            const cInput = document.getElementById('confirm-password');

            msg.classList.add('hidden'); 

            if (isLogin) {
                tLogin.className = "pb-2 border-b-2 border-brand text-brand font-bold transition";
                tReg.className = "pb-2 border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition";
                cBox.classList.add('hidden');
                cInput.removeAttribute('required'); // 登录时不需要必填
                btn.textContent = "立即登录";
            } else {
                tReg.className = "pb-2 border-b-2 border-brand text-brand font-bold transition";
                tLogin.className = "pb-2 border-b-2 border-transparent text-gray-400 hover:text-gray-600 transition";
                cBox.classList.remove('hidden');
                cInput.setAttribute('required', 'true'); // 注册时必填
                btn.textContent = "创建账户";
            }
        }

        // 将包含非 ASCII 的邮箱映射为可被 Supabase 接受的安全 ASCII 形式
        const buildAuthEmail = (input) => {
            const trimmed = input.trim().normalize('NFC');
            const hasNonAscii = /[^\x00-\x7F]/.test(trimmed);

            if (!hasNonAscii) {
                return { authEmail: trimmed.toLowerCase(), rawEmail: null };
            }

            // 使用 URL 安全的 base64 作为本地部分，确保 Supabase 校验通过
            const base64 = btoa(unescape(encodeURIComponent(trimmed)))
                .replace(/\+/g, '-')
                .replace(/\//g, '_')
                .replace(/=+$/g, '');

            const alias = `u-${base64}@unicode.tcw.local`;
            return { authEmail: alias, rawEmail: trimmed };
        };

        document.getElementById('auth-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const confirmPwd = document.getElementById('confirm-password').value;
            const btn = document.getElementById('btn-submit');
            const errEl = document.getElementById('error-msg');
            const succEl = document.getElementById('success-msg');

            // 前端校验
            errEl.classList.add('hidden');
            succEl.classList.add('hidden');

            if (!isLogin && password !== confirmPwd) {
                errEl.textContent = "❌ 两次输入的密码不一致";
                errEl.classList.remove('hidden');
                return;
            }

            if (!isLogin && password.length < 6) {
                errEl.textContent = "❌ 密码长度至少需要6位";
                errEl.classList.remove('hidden');
                return;
            }

            const { authEmail, rawEmail } = buildAuthEmail(email);

            btn.disabled = true;
            btn.textContent = "处理中...";

            try {
                let error = null;
                
                if (isLogin) {
                    // 登录
                    const { error: signInErr } = await supabase.auth.signInWithPassword({ email: authEmail, password });
                    error = signInErr;
                    if (!error) {
                        const params = new URLSearchParams(window.location.search);
                        const redirect = params.get('redirect') || 'index.html';
                        window.location.href = redirect;
                    }
                } else {
                    // 注册
                    const { error: signUpErr } = await supabase.auth.signUp({
                        email: authEmail,
                        password,
                        options: rawEmail ? { data: { raw_email: rawEmail } } : undefined
                    });
                    error = signUpErr;
                    if (!error) {
                        succEl.textContent = "✅ 注册成功！请直接登录（或检查邮箱验证）。";
                        succEl.classList.remove('hidden');
                        setTimeout(() => {
                            // 自动填入密码并切换到登录态，方便用户直接点登录
                            toggleMode('login');
                            document.getElementById('success-msg').classList.remove('hidden'); // 保持成功提示
                        }, 1500);
                    }
                }

                if (error) throw error;

            } catch (err) {
                const friendly = err.message === "Invalid login credentials" ? "邮箱或密码错误" : err.message;
                errEl.textContent = `❌ ${friendly}${rawEmail ? "（已自动兼容中文邮箱，若仍失败请联系客服）" : ''}`;
                errEl.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = isLogin ? "立即登录" : "创建账户";
            }
        });
    </script>
</body>
</html>
