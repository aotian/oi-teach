<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>我的账户 - 童澄未来</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root{ --brand:#f97316; --line:#ffe4cc; --bg:#fff7ed; --ink:#1f2937; }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Roboto,Arial,sans-serif;color:var(--ink)}
    .wrap{max-width:1100px;margin:24px auto;padding:0 16px}
    h1{margin:0 0 12px 0}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:16px}
    .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px}
    .muted{color:#64748b;font-size:13px}
    .btn{display:inline-block;background:var(--brand);color:#fff;border-radius:10px;padding:10px 14px;text-decoration:none;cursor:pointer}
    .btn.gray{background:#6b7280}
    .pill{display:inline-block;margin-left:8px;padding:2px 8px;border-radius:999px;border:1px solid #e5e7eb;background:#f9fafb;color:#6b7280;font-size:12px}
    .pill.green{background:#d1fae5;border-color:#6ee7b7;color:#10b981}
    table{width:100%;border-collapse:collapse;margin-top:8px}
    th,td{border-bottom:1px dashed #eee;padding:10px 8px;text-align:left;font-size:14px}
    .admin-only{margin-top:12px;padding:12px;border:1px dashed #d1fae5;background:#f0fdf4;border-radius:10px}
    @media (max-width:860px){ .row{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>我的账户</h1>

    <div class="row">
      <!-- 左：会员状态 -->
      <div class="card">
        <h3>会员状态 <span id="vip-pill" class="pill">未开通</span></h3>
        <p class="muted">到期：<span id="expire">—</span></p>
        <div style="margin-top:12px">
          <a class="btn" href="upgrade.html">去升级 / 续费</a>
          <button id="logout" class="btn gray" style="margin-left:8px">退出登录</button>
        </div>
      </div>

      <!-- 右：账号资料 -->
      <div class="card">
        <h3>账户资料</h3>
        <p class="muted">邮箱：<span id="email">—</span></p>
        <p class="muted">用户ID：<span id="uid">—</span></p>
        <p class="muted">角色：<span id="role">—</span></p>

        <!-- 仅管理员可见 -->
        <div id="admin-panel" class="admin-only" style="display:none">
          <div style="font-weight:700;color:#065f46;margin-bottom:6px">管理员工具</div>
          <a class="btn" href="admin-orders.html">进入订单审核后台</a>
        </div>
      </div>
    </div>

    <!-- 我的订单 -->
    <div class="card" style="margin-top:16px">
      <h3>我的订单（最近 20 条）</h3>
      <div class="muted">若无记录，请上传支付截图后等待审核。</div>
      <table id="orders">
        <thead>
          <tr>
            <th>时间</th><th>邮箱</th><th>截图</th><th>备注</th><th>状态</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </div>

  <script type="module">
    import supabaseClient from './client.js';

    function fmt(t){ try{ return new Date(t).toLocaleString(); }catch{return t||'—'} }

    async function main(){
      const { data } = await supabaseClient.auth.getUser();
      const user = data?.user;
      if (!user) { location.href = 'login.html?redirect=' + encodeURIComponent(location.pathname); return; }

      // 账号资料
      document.getElementById('email').textContent = user.email || '—';
      document.getElementById('uid').textContent = user.id;

      // profile
      let role='free_user', expires=null;
      const prof = await supabaseClient.from('profiles').select('role,membership_expires_at').eq('id', user.id).maybeSingle();
      if (prof?.data){ role = prof.data.role || 'free_user'; expires = prof.data.membership_expires_at || null; }
      document.getElementById('role').textContent = role;

      // 会员状态徽章 + 到期
      const paid = role==='admin' || (role==='paid_user' && expires && new Date(expires)>new Date());
      const pill = document.getElementById('vip-pill');
      pill.textContent = paid ? '已开通' : '未开通';
      if (paid) pill.classList.add('green');
      document.getElementById('expire').textContent = expires ? fmt(expires) : '—';

      // 退出
      document.getElementById('logout').addEventListener('click', async ()=>{
        await supabaseClient.auth.signOut();
        location.href = 'index.html';
      });

      // 管理员区块
      if (role === 'admin') document.getElementById('admin-panel').style.display = 'block';

      // 订单列表
      const tb = document.querySelector('#orders tbody');
      tb.innerHTML = '<tr><td colspan="5" class="muted">加载中…</td></tr>';
      const { data: rows, error } = await supabaseClient
        .from('orders')
        .select('created_at,email,image_url,memo,status')
        .eq('user_id', user.id)
        .order('created_at', { ascending:false })
        .limit(20);

      if (error){ tb.innerHTML = `<tr><td colspan="5" class="muted">加载失败：${error.message}</td></tr>`; return; }
      if (!rows || rows.length===0){ tb.innerHTML = '<tr><td colspan="5" class="muted">暂无记录</td></tr>'; return; }

      tb.innerHTML = rows.map(r => `
        <tr>
          <td>${fmt(r.created_at)}</td>
          <td>${r.email || ''}</td>
          <td>${r.image_url ? `<a href="${r.image_url}" target="_blank">查看截图</a>` : ''}</td>
          <td>${r.memo || ''}</td>
          <td>${r.status || ''}</td>
        </tr>
      `).join('');
    }

    main().catch(console.error);
  </script>

  <!-- 只需 client.js（你已全站引用 CDN） -->
  <script type="module" src="client.js"></script>
</body>
</html>
